<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fiche Pédagogique d'une séance — Espace π</title>
  <!-- Tailwind CSS CDN (non-blocking; critical fallback CSS is defined inline below) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- JSZip for client-side .pptx XML slide parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- Google Fonts: Inter & Cairo for UI/Arabic labels; Caveat & Dancing Script for connected cursive accents -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700&family=Caveat:wght@600;700&family=Dancing+Script:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg-canvas: #eef2f8;
      --phone-bg: #ffffff;
      --ink-navy: #111625;
      --muted-gray: #8d95a5;
      --surface-gray: #eceef1;
      --royal-blue: #1857b8;
      --royal-blue-hover: #134696;
      --ouverture-blue: #4f81bd;
      --sheet-white: #ffffff;
      --sheet-ink: #0b0d12;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--ink-navy);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    /* Core fallback layout rules in case Tailwind CDN is slow or offline */
    #app-shell {
      position: relative;
      width: 100%;
      max-width: 420px;
      min-height: 760px;
      background-color: #ffffff;
      border-radius: 32px;
      box-shadow: 0 24px 70px -15px rgba(17, 22, 37, 0.18);
      border: 1px solid rgba(226, 232, 240, 0.9);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    @media (max-width: 639px) {
      body {
        padding: 0;
        background-color: #ffffff;
      }
      #app-shell {
        max-width: 100%;
        min-height: 100vh;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }
    }

    #screen-container {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 28px 24px 112px 24px;
    }

    .hidden {
      display: none !important;
    }

    .arabic-label {
      font-family: 'Cairo', 'Inter', sans-serif;
      direction: rtl;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .screen-enter {
      animation: fadeSlideUp 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .bottom-waves {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 120px;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .pi-badge {
      margin: 0 auto;
      width: 72px;
      height: 72px;
      border-radius: 9999px;
      border: 2.5px solid #1857b8;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(24, 87, 184, 0.12);
      user-select: none;
    }

    .btn-primary-royal {
      width: 100%;
      min-height: 56px;
      border-radius: 16px;
      background-color: #1857b8;
      color: #ffffff;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 10px 24px -6px rgba(24, 87, 184, 0.45);
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .btn-primary-royal:hover {
      background-color: #134696;
    }

    .btn-primary-royal:active {
      transform: scale(0.99);
    }

    .hub-card-btn {
      width: 100%;
      min-height: 96px;
      padding: 16px 20px;
      border-radius: 22px;
      background-color: #eceef1;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .hub-card-btn:hover {
      background-color: #e2e6ec;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background-color: rgba(15, 23, 42, 0.52);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-card {
      width: 100%;
      max-width: 390px;
      max-height: 82vh;
      background-color: #ffffff;
      border-radius: 24px;
      box-shadow: 0 24px 50px rgba(15, 23, 42, 0.25);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .upload-dropzone {
      background-color: #eceef1;
      border: 2px solid #d5dae2;
      border-radius: 26px;
      padding: 14px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    .upload-dropzone-inner {
      border: 1.5px dashed #9aa4b5;
      border-radius: 18px;
      min-height: 210px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: all 0.2s ease;
    }

    .upload-dropzone.drag-over .upload-dropzone-inner {
      border-color: #1857b8;
      background-color: rgba(24, 87, 184, 0.06);
      transform: scale(0.99);
    }

    /* Requested worksheet font-family across all worksheet elements */
    .fiche-sheet,
    .fiche-sheet *,
    .fiche-script-accent,
    .fiche-cursive-italic,
    .fiche-table,
    .fiche-table th,
    .fiche-table td {
      font-family: 'Comic Sans MS', 'Segoe UI', cursive, sans-serif;
    }

    /* Connected cursive accent styling layered cleanly over the worksheet font */
    .fiche-script-accent,
    .fiche-cursive-italic {
      font-family: 'Caveat', 'Dancing Script', 'Comic Sans MS', 'Segoe UI', cursive, sans-serif;
    }

    /* Borderless outer sheet while keeping all inner table cell borders intact */
    .fiche-sheet {
      background: var(--sheet-white);
      color: var(--sheet-ink);
      border: none;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      page-break-inside: auto;
      break-inside: auto;
    }

    /* Bold and underlined styling for phrases enclosed within «» */
    .fiche-guillemet-bold-ul {
      font-weight: 800;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 2px;
    }

    /* Underline strictly for extracted items in binôme and autonome */
    .fiche-extracted-ul {
      text-decoration: underline;
      text-decoration-thickness: 1.5px;
      text-underline-offset: 2px;
      font-weight: 700;
    }

    .fiche-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      color: var(--sheet-ink);
      page-break-inside: auto;
      break-inside: auto;
    }

    .fiche-table th,
    .fiche-table td {
      border: 1px solid var(--sheet-ink);
      padding: 5px 6px;
      vertical-align: top;
      word-wrap: break-word;
      overflow-wrap: break-word;
      color: var(--sheet-ink);
    }

    .fiche-table thead {
      display: table-header-group;
    }

    .fiche-table tr {
      page-break-inside: auto;
      break-inside: auto;
    }

    /* Alternating #4f81bd and #ffffff header rows */
    .fiche-row-ouverture {
      background-color: var(--ouverture-blue);
      color: #ffffff;
      font-weight: 700;
    }

    .fiche-row-ouverture td,
    .fiche-row-ouverture th {
      background-color: var(--ouverture-blue);
      color: #ffffff;
      border-color: var(--sheet-ink);
    }

    .fiche-row-white {
      background-color: var(--sheet-white);
      color: var(--sheet-ink);
      font-weight: 700;
    }

    .fiche-row-white td,
    .fiche-row-white th {
      background-color: var(--sheet-white);
      color: var(--sheet-ink);
      border-color: var(--sheet-ink);
    }

    .fiche-ouverture-band,
    .fiche-side-band {
      background-color: var(--ouverture-blue);
      color: #ffffff;
      font-weight: 700;
      text-align: center;
      vertical-align: middle !important;
    }

    .fiche-editable-cell[contenteditable="true"] {
      outline: none;
      border-radius: 4px;
      transition: background-color 0.15s ease, box-shadow 0.15s ease;
    }

    .fiche-edit-active .fiche-editable-cell[contenteditable="true"]:hover,
    .fiche-edit-active .fiche-editable-cell[contenteditable="true"]:focus {
      background-color: rgba(24, 87, 184, 0.11);
      box-shadow: inset 0 0 0 1.5px rgba(11, 13, 18, 0.45);
    }

    /* Natural multi-page A4 print flow without forced page breaks or scaling hacks */
    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm;
      }

      body {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
        display: block !important;
        min-height: auto !important;
        color: #0b0d12 !important;
      }

      #app-shell {
        max-width: 100% !important;
        width: 100% !important;
        min-height: auto !important;
        border: none !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        overflow: visible !important;
        background: #ffffff !important;
      }

      #toast-banner,
      #diagnostic-error-banner,
      .bottom-waves,
      .no-print {
        display: none !important;
      }

      .fiche-editable-cell[contenteditable="true"] {
        background-color: transparent !important;
        box-shadow: none !important;
        outline: none !important;
      }

      #screen-container {
        padding: 0 !important;
        overflow: visible !important;
      }

      .fiche-sheet,
      .fiche-sheet *,
      .fiche-script-accent,
      .fiche-cursive-italic,
      .fiche-table,
      .fiche-table th,
      .fiche-table td {
        font-family: 'Comic Sans MS', 'Segoe UI', cursive, sans-serif !important;
      }

      .fiche-sheet {
        border: none !important;
        box-shadow: none !important;
        color: #0b0d12 !important;
        font-size: 11.5px !important;
        line-height: 1.25 !important;
        padding: 4px !important;
        page-break-inside: auto !important;
        break-inside: auto !important;
      }

      .fiche-table {
        page-break-inside: auto !important;
        break-inside: auto !important;
        margin-bottom: 4px !important;
      }

      .fiche-table thead {
        display: table-header-group !important;
      }

      .fiche-table tr {
        page-break-inside: auto !important;
        break-inside: auto !important;
      }

      .fiche-table th,
      .fiche-table td {
        padding: 3.5px 5px !important;
        border-color: #0b0d12 !important;
      }

      .fiche-guillemet-bold-ul,
      .fiche-extracted-ul {
        text-decoration: underline !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .fiche-row-ouverture,
      .fiche-ouverture-band,
      .fiche-side-band {
        background-color: #4f81bd !important;
        color: #ffffff !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .fiche-row-white,
      .fiche-row-white td {
        background-color: #ffffff !important;
        color: #0b0d12 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>
  <!-- Main Application Shell -->
  <main
    id="app-shell"
    class="relative w-full max-w-[420px] min-h-[760px] sm:min-h-[820px] bg-white rounded-none sm:rounded-[38px] shadow-[0_24px_70px_-15px_rgba(17,22,37,0.18)] border border-slate-200/80 overflow-hidden flex flex-col justify-between"
  >
    <!-- Non-blocking Toast Banner -->
    <div
      id="toast-banner"
      role="status"
      aria-live="polite"
      class="hidden fixed sm:absolute top-4 inset-x-4 z-50 rounded-2xl px-4 py-3 text-sm font-semibold shadow-lg border transition-all duration-200 flex items-center justify-between gap-2 no-print"
    >
      <span id="toast-message"></span>
      <button
        type="button"
        id="toast-close"
        aria-label="Fermer la notification"
        class="text-xs opacity-70 hover:opacity-100 p-1 rounded-full cursor-pointer"
      >
        ✕
      </button>
    </div>

    <!-- Diagnostic Runtime Error Banner -->
    <div
      id="diagnostic-error-banner"
      role="alert"
      class="hidden fixed sm:absolute bottom-4 inset-x-4 z-50 rounded-2xl px-4 py-3 text-xs font-bold bg-rose-50 text-rose-900 border border-rose-300 shadow-lg flex items-center justify-between gap-2 no-print"
    >
      <span id="diagnostic-error-text"></span>
      <button
        type="button"
        id="diagnostic-error-close"
        aria-label="Fermer l'alerte"
        class="text-xs px-2 py-1 rounded-lg bg-rose-100 hover:bg-rose-200 cursor-pointer shrink-0"
      >
        OK
      </button>
    </div>

    <!-- Dynamic Screen Container -->
    <div id="screen-container" class="relative z-10 flex-1 flex flex-col px-6 pt-7 pb-28">
      <!-- Rendered immediately and synchronously via window.renderApp() -->
    </div>

    <!-- Decorative Bottom Waves -->
    <div class="bottom-waves" aria-hidden="true">
      <svg viewBox="0 0 420 130" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full object-cover">
        <path
          d="M0 32C88 10 156 64 252 46C328 32 378 8 420 22V130H0V32Z"
          fill="#DCE7F9"
          fill-opacity="0.72"
        />
        <path
          d="M0 58C105 84 185 28 286 54C352 71 392 52 420 42V130H0V58Z"
          fill="#BED4F7"
          fill-opacity="0.65"
        />
        <path
          d="M0 84C92 68 175 104 278 82C345 68 388 86 420 94V130H0V84Z"
          fill="#9EC0F4"
          fill-opacity="0.45"
        />
      </svg>
    </div>
  </main>

  <!-- Standard synchronous script (NOT type="module") for instant, zero-blocker rendering -->
  <script>
    (function () {
      'use strict';

      // Storage keys for local persistence and background Firestore synchronization
      var STORAGE_KEYS = {
        USERS: 'fiche_tech_users_v1',
        API_KEY: 'fiche_tech_gemini_api_key_v1',
        SAVED_FICHES: 'fiche_tech_saved_fiches_v1'
      };

      // Default seed users for local operation
      var DEFAULT_USERS = [
        { id: '1', name: 'Alice', password: '', passwordMask: '•••••••••', frozen: false, active: true },
        { id: '2', name: 'Benoît', password: '', passwordMask: '••••••••••••', frozen: false, active: true },
        { id: '3', name: 'Claire', password: '', passwordMask: '••••••••', frozen: false, active: false },
        { id: '4', name: 'David', password: '', passwordMask: '•••••••••••', frozen: false, active: true }
      ];

      // Reference headings used during PPTX slide analysis
      var NINE_SECTION_HEADINGS = [
        'Activite prérequis',
        'Définitions et Propriétés',
        'Vérification',
        'Modlage',
        "Déclaration d'objectif",
        'Activité guidee',
        'Activité binôme',
        'Activité autonome',
        'Clôture'
      ];

      var RADICAL_GUIDEE_PHRASE =
        '- Réduire une expression en regroupant les radicaux semblables et en appliquant les règles sur la somme, la différence et la non-additivité des radicaux.';

      // Optional Firebase configuration
      var firebaseConfig = {
        apiKey: 'AIzaSyAtl1H7juxl0NTyGPSTgjm6yg4wJrA5XTo',
        authDomain: 'fiche-tech.firebaseapp.com',
        projectId: 'fiche-tech',
        storageBucket: 'fiche-tech.firebasestorage.app',
        messagingSenderId: '542981358367',
        appId: '1:542981358367:web:6f4cb3a11b6693cb82e62a',
        measurementId: 'G-ST5YXB9L65'
      };

      /**
       * Builds the standardized homework instruction line.
       */
      function buildHomeworkLine(binomePage) {
        var hasPage =
          binomePage !== undefined &&
          binomePage !== null &&
          String(binomePage).trim() !== '' &&
          !isNaN(Number(binomePage));
        var pageSuffix = hasPage ? String(parseInt(binomePage, 10)) : '...';
        return 'Faire d\'exercice "Je m\'entraîne à la maison" page ' + pageSuffix;
      }

      /**
       * Extracts PPT filename base title (e.g. "P12_..." -> "P12_...") for primary worksheet identity.
       */
      function extractPptFilenameTitle(fileName, fallbackLabel) {
        var rawName = String(fileName || '').trim();
        if (rawName) {
          var withoutExt = rawName.replace(/\.[^.]+$/, '').trim();
          if (withoutExt) return withoutExt;
        }
        return String(fallbackLabel || '').replace(/^«|»$/g, '').trim();
      }

      /**
       * Reads users safely from localStorage with fallback to defaults.
       */
      function readLocalUsers() {
        try {
          var raw = window.localStorage.getItem(STORAGE_KEYS.USERS);
          if (!raw) {
            window.localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(DEFAULT_USERS));
            return DEFAULT_USERS.map(function (u) { return Object.assign({}, u); });
          }
          var parsed = JSON.parse(raw);
          return Array.isArray(parsed) && parsed.length > 0
            ? parsed
            : DEFAULT_USERS.map(function (u) { return Object.assign({}, u); });
        } catch (e) {
          return DEFAULT_USERS.map(function (u) { return Object.assign({}, u); });
        }
      }

      /**
       * Writes users safely to localStorage.
       */
      function writeLocalUsers(users) {
        try {
          window.localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users));
        } catch (err) {
          console.warn('localStorage write users warning:', err);
        }
      }

      /**
       * Reads stored Gemini API key safely from localStorage.
       */
      function readLocalApiKey() {
        try {
          return (window.localStorage.getItem(STORAGE_KEYS.API_KEY) || '').trim();
        } catch (e) {
          return '';
        }
      }

      /**
       * Saves or removes Gemini API key in localStorage.
       */
      function writeLocalApiKey(keyVal) {
        try {
          var cleaned = (keyVal || '').trim();
          if (cleaned) {
            window.localStorage.setItem(STORAGE_KEYS.API_KEY, cleaned);
          } else {
            window.localStorage.removeItem(STORAGE_KEYS.API_KEY);
          }
        } catch (err) {
          console.warn('localStorage write apiKey warning:', err);
        }
      }

      /**
       * Reads saved ready-made worksheets safely from localStorage.
       */
      function readLocalSavedFichesList() {
        try {
          var raw = window.localStorage.getItem(STORAGE_KEYS.SAVED_FICHES);
          if (!raw) return [];
          var parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) return parsed;
          if (parsed && typeof parsed === 'object') {
            return Object.keys(parsed)
              .filter(function (key) {
                var val = parsed[key];
                return val && typeof val === 'object' && val.fiche;
              })
              .map(function (key) {
                var val = parsed[key];
                return {
                  id: val.id || key,
                  title: val.title || (val.fiche && (val.fiche.pptTitle || val.fiche.ppt_title || val.fiche.titre_de_tache)) || key,
                  section: val.section || key,
                  fiche: val.fiche,
                  updatedAt: val.updatedAt || new Date().toISOString()
                };
              });
          }
          return [];
        } catch (e) {
          return [];
        }
      }

      /**
       * Writes saved ready-made worksheets safely to localStorage.
       */
      function writeLocalSavedFichesList(list) {
        try {
          window.localStorage.setItem(STORAGE_KEYS.SAVED_FICHES, JSON.stringify(list));
        } catch (err) {
          console.warn('localStorage write saved fiches warning:', err);
        }
      }

      /**
       * Normalizes a worksheet title for duplicate detection.
       */
      function normalizeFicheTitleKey(title) {
        return String(title || '')
          .replace(/^«|»$/g, '')
          .replace(/\s+/g, ' ')
          .trim()
          .toLowerCase();
      }

      /**
       * Resolves the PPT filename identity (P...) when present, or falls back cleanly.
       */
      function getFicheIdentityTitle(fiche, sectionName) {
        var pptTitle = String((fiche && (fiche.pptTitle || fiche.ppt_title)) || '').trim();
        if (pptTitle) return pptTitle;
        return String((fiche && fiche.titre_de_tache) || sectionName || 'fiche-pedagogique')
          .replace(/^«|»$/g, '')
          .trim();
      }

      /**
       * Builds the target .htm filename:
       * - For Consolidation: "Consolidation <number>.htm"
       * - For lesson fiches: "<PPT_Title>.htm"
       */
      function buildFicheHtmFileName(fiche, sectionName) {
        var isConsol = Boolean(fiche && fiche.isConsolidation) || sectionName === 'Consolidation';
        if (isConsol) {
          var rawTitle = String((fiche && fiche.titre_de_tache) || '').trim();
          var numMatch = rawTitle.match(/consolidation\s*(\d+)/i);
          var num = numMatch && numMatch[1]
            ? numMatch[1]
            : String((fiche && fiche.numero_tache) || '1').replace(/[^\d]/g, '') || '1';
          return 'Consolidation ' + num + '.htm';
        }
        var identityTitle = getFicheIdentityTitle(fiche, sectionName)
          .replace(/[\\/:*?"<>|]+/g, ' ')
          .replace(/\s+/g, ' ')
          .trim() || 'fiche-pedagogique';
        return identityTitle + '.htm';
      }

      /**
       * Central application state across all 5 screens ('login', 'accueil', 'upload', 'preview', 'admin').
       */
      var state = {
        screen: 'login',
        authMode: 'login', // 'login' | 'register'
        currentUser: null,
        isAdmin: false,
        showSectionChooser: false,
        showReadyFichesModal: false,
        openedFromSavedList: false,
        savedFiches: readLocalSavedFichesList(),
        selectedSection: 'premier pages', // 'premier pages' | 'Autre Seance' | 'Consolidation'
        uploadedFile: null, // { name, size, type, rawFile, imageDataUrl }
        parsedSlides: [], // [{ slideNumber, text }]
        generatedFiche: null,
        originalFicheBackup: null,
        isAnalyzing: false,
        analysisError: '',
        ficheEditEnabled: true,
        users: readLocalUsers(),

      /**
       * Escapes HTML special characters safely.

      function escapeHtml(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');

      /**
       * Wraps phrases enclosed within «» in a bold underlined span.
       */
      function formatGuillemetsBoldUnderline(rawText) {
        var text = String(rawText == null ? '' : rawText);
        var parts = text.split(/(«[^»]*»)/g);
        return parts
          .map(function (part) {
            if (/^«[^»]*»$/.test(part)) {

      /**
       * Ensures every line/item in préparatoire and guidée starts with "- ".

      function ensureLeadingDash(rawText) {
        var text = String(rawText == null ? '' : rawText).trim();
        if (!text) return '';
        if (/^-\s+/.test(text)) return text;
        return '- ' + text.replace(/^[•*–—]+\s*/, '').trim();

      /**
       * Smooths guided practice phrasing and links task + lesson property/rule/definition.
       */
      function smoothGuideePhrase(rawText, basisText, lessonTitle) {
        var cleaned = stripActivityAndRituelleWords(rawText || '')
          .replace(/\b(?:en utilisant|avec)\s+(?:la propriété de|les règles de)\s+(?:en utilisant|avec)\b/gi, 'en utilisant')
          .replace(/\b(de|du|des)\s+(de|du|des)\b/gi, '$1')
          .replace(/\b(en|à|au|aux)\s+(en|à|au|aux)\b/gi, '$1')
          .replace(/\s*,\s*,/g, ',')
          .replace(/\s{2,}/g, ' ')
          .trim();

        var fallbackBasis = String(basisText || '').trim();
        var titleFallback = String(lessonTitle || '').replace(/^«|»$/g, '').trim();

        if (/priorit[ée]/i.test(cleaned) && /expression|calcul/i.test(cleaned)) {
          cleaned = 'Calculer une expression en respectant la priorité des opérations.';
        } else if (
          /radicaux\s+semblables|non-additivit[ée]|radicaux/i.test(cleaned) ||
          /radical|radicaux|racine/i.test(fallbackBasis)
        ) {
          return RADICAL_GUIDEE_PHRASE;
        } else if (!cleaned) {
          if (fallbackBasis) {
            cleaned = 'Appliquer ' + fallbackBasis + ' dans la résolution guidée.';
          } else if (titleFallback) {
            cleaned = 'Résoudre la tâche guidée en utilisant ' + titleFallback + '.';
          } else {
            cleaned = 'Appliquer la propriété de la leçon pour résoudre la tâche guidée.';
          }
        } else {
          var withoutEndingPunct = cleaned.replace(/[.!?]+$/g, '').trim();
          var hasPropertyOrMethod =
            /en utilisant|propri[ée]t[ée]|r[èe]gle|d[ée]finition|respectant/i.test(
              withoutEndingPunct
            );
          if (!hasPropertyOrMethod) {
            if (fallbackBasis) {
              cleaned = withoutEndingPunct + ' selon ' + fallbackBasis + '.';
            } else if (titleFallback) {
              cleaned = withoutEndingPunct + ' en utilisant ' + titleFallback + '.';
            } else {
              cleaned = withoutEndingPunct + '.';
            }
          } else {
            cleaned = withoutEndingPunct + '.';
          }
        }

        cleaned = cleaned.charAt(0).toUpperCase() + cleaned.slice(1);
        return ensureLeadingDash(cleaned);
      }

      /**

      function renderExtractedItemsWithGuillemets(segmentText) {

      function formatBinomeExtractedUnderline(rawBinomeText) {

        if (!text) return '';

        var match = text.match(/^(.*?)\s*:\s*en utilisant\s+(.+?)([.!?]*)$/i);
        if (match) {
          var extractedPrompt = match[1].trim();
          var extractedMethod = match[2].trim();

          return (
            renderExtractedItemsWithGuillemets(extractedPrompt) +
            ' : en utilisant ' +

        return renderExtractedItemsWithGuillemets(text);

      /**

      function formatFileSize(bytes) {
        if (!bytes && bytes !== 0) return '';
        if (bytes < 1024) return bytes + ' o';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' Ko';
        return (bytes / (1024 * 1024)).toFixed(2) + ' Mo';

          reader.readAsDataURL(file);

 /**

      function stripArabic(rawText) {

      function cleanTopicTitle(rawLine) {

      /**

      function extractQuestionPromptOnly(rawText, fallbackPrompt) {

        promptPart = promptPart

      /**
       * Dynamically extracts Leçon, Période, Tâche, and binôme page number when present.
       */
      function extractCourseMetadataAndBinomePage(fileName, slides) {
        var safeSlides = Array.isArray(slides) ? slides : [];
        var joinedText = [fileName || ''].concat(safeSlides.map(function (s) { return s.text || ''; })).join('\n');

        var leconMatch = joinedText.match(
          /\b(?:le[çc]on|chapitre|s[ée]quence|unit[ée])\s*(?:n[°o.]?|num[ée]ro)?\s*[:\-]?\s*0?(\d{1,2})\b/i
        );
        var fileLeconMatch = String(fileName || '').match(
          /(?:le[çc]on|chap|seance|s[ée]ance|cours|fiche)[\s._-]*0?(\d{1,2})\b/i
        );
        var numeroLecon = leconMatch && leconMatch[1]
          ? String(parseInt(leconMatch[1], 10))
          : fileLeconMatch && fileLeconMatch[1]
            ? String(parseInt(fileLeconMatch[1], 10))
            : '...';

        var periodeMatch = joinedText.match(
          /\bp[ée]riode\s*(?:n[°o.]?|num[ée]ro)?\s*[:\-]?\s*0?(\d{1,2})\b/i
        );
        var periode = periodeMatch && periodeMatch[1] ? String(parseInt(periodeMatch[1], 10)) : '...';

        var tacheMatch = joinedText.match(
          /\bt[âa]che\s*(?:n[°o.]?|num[ée]ro)?\s*[:\-]?\s*0?(\d{1,2})\b/i
        );
        var numeroTache = tacheMatch && tacheMatch[1] ? String(parseInt(tacheMatch[1], 10)) : '...';

        var binomePage = null;
        var binomeIdx = safeSlides.findIndex(function (s) {
          return /activit[ée]\s*bin[ôo]me|je\s+m'entra[îi]ne\s+en\s+bin[ôo]me/i.test(s.text || '');
        });
        var searchTargets = [];
        if (binomeIdx >= 0) {
          searchTargets.push(safeSlides[binomeIdx].text || '');
          if (safeSlides[binomeIdx + 1]) searchTargets.push(safeSlides[binomeIdx + 1].text || '');
        }
        var autoIdx = safeSlides.findIndex(function (s) {
          return /activit[ée]\s*autonome/i.test(s.text || '');
        });
        if (autoIdx >= 0) {
          searchTargets.push(safeSlides[autoIdx].text || '');
          if (safeSlides[autoIdx + 1]) searchTargets.push(safeSlides[autoIdx + 1].text || '');
        }
        searchTargets.push(joinedText);

        for (var i = 0; i < searchTargets.length; i++) {
          var pageMatch = String(searchTargets[i]).match(/\b(?:page|pages|p\.?)\s*(\d{1,3})\b/i);
          if (pageMatch && pageMatch[1]) {
            binomePage = parseInt(pageMatch[1], 10);
            break;
          }
        }

        return {
          numero_lecon: numeroLecon,
          periode: periode,
          numero_tache: numeroTache,
          binomePage: binomePage
        };
      }

      /**
       * Parses a .pptx file via JSZip (ppt/slides/slideN.xml) into ordered slides.
       */
      async function parsePptxSlides(file) {
        if (typeof window.JSZip === 'undefined') {
          throw new Error('Bibliothèque JSZip non chargée.');
        }
        var arrayBuffer = await file.arrayBuffer();
        var zip = await window.JSZip.loadAsync(arrayBuffer);

        var slideEntries = Object.keys(zip.files)
          .filter(function (path) { return /^ppt\/slides\/slide\d+\.xml$/i.test(path); })
          .sort(function (a, b) {
            var numA = parseInt((a.match(/slide(\d+)\.xml/i) || [])[1] || '0', 10);
            var numB = parseInt((b.match(/slide(\d+)\.xml/i) || [])[1] || '0', 10);
            return numA - numB;
          });

        var parser = new DOMParser();
        var slides = [];

        for (var i = 0; i < slideEntries.length; i++) {
          var xmlText = await zip.files[slideEntries[i]].async('string');
          var xmlDoc = parser.parseFromString(xmlText, 'application/xml');
          var textNodes = Array.prototype.slice.call(xmlDoc.getElementsByTagNameNS('*', 't'));
          var slideText = textNodes
            .map(function (node) { return node.textContent || ''; })
            .join(' ')
            .replace(/\s+/g, ' ')
            .trim();

          slides.push({
            slideNumber: i + 1,
            text: slideText
          });
        }

        return slides;

      /**

      function buildFallbackFicheFromSlides(fileName, slides) {
        var safeSlides = Array.isArray(slides) ? slides : [];
        var joined = safeSlides.map(function (s) {
          return '[Diapositive ' + s.slideNumber + '] ' + s.text;
        }).join('\n');
        var pptBaseTitle = extractPptFilenameTitle(fileName, 'Séance de mathématiques');

          stripArabic(fileName.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ')) ||
          'Séance de mathématiques';

        var effectiveBinomePage = meta.binomePage !== null ? meta.binomePage : 36;

        var isRadicalTopic = /radical|radicaux|racine/i.test(joined);
        var isPriorityTopic = /priorit[ée]/i.test(joined);

        var topics = ['Notion principale de la leçon'];
        if (isRadicalTopic) {

        } else if (isPriorityTopic) {
          topics[0] = 'Règles de priorité des opérations';
        } else if (/produit|multiplication/i.test(joined)) {
          topics[0] = 'Produit de deux nombres relatifs';
        } else if (/somme|addition|soustraction/i.test(joined)) {
          topics[0] = 'Somme et différence de nombres relatifs';
        }

        var methodBasis = topics[0].toLowerCase();
        var guideePhrase = 'Effectuer la tâche guidée en utilisant ' + methodBasis + '.';
        if (isRadicalTopic) {
          guideePhrase = RADICAL_GUIDEE_PHRASE;
        } else if (isPriorityTopic) {
          guideePhrase = 'Calculer une expression en respectant la priorité des opérations.';
        }
        guideePhrase = smoothGuideePhrase(guideePhrase, topics[0], cleanedTitle);

        return {
          isConsolidation: false,
          pptTitle: pptBaseTitle,
          ppt_title: pptBaseTitle,
          titre_de_tache: cleanedTitle,

          numero_lecon: meta.numero_lecon,

          activite_prerequis: ensureLeadingDash(
            'Effectuer des calculs préparatoires en lien avec ' + methodBasis + '.'
          ),

          activite_guidee: guideePhrase,
          activite_binome: 'Compléter les égalités suivantes : en utilisant ' + methodBasis + '.',
          activite_autonome: 'Compléter les égalités suivantes :',

      }

      function buildFallbackConsolidationFiche(fileName) {

      /**
       * Normalizes Consolidation extracted fields and enforces required structure.
       */
      function normalizeConsolidationResult(raw, fileName) {
        var fallback = buildFallbackConsolidationFiche(fileName);
        var pptBaseTitle = extractPptFilenameTitle(fileName, '');

        var rawTitle = stripArabic((raw && (raw.titre_de_tache || raw.Titre)) || '');
        var numMatch =
          rawTitle.match(/consolidation\s*(\d+)/i) ||
          String(fileName || '').match(/consolidation\s*(\d+)/i);
        var consolNum = numMatch && numMatch[1]
          ? String(parseInt(numMatch[1], 10))
          : (fallback.titre_de_tache.match(/consolidation\s*(\d+)/i) || [])[1] || '1';

        var courseTitle = rawTitle
          .replace(/^(?:titre\s*[:\-]?\s*)?consolidation\s*\d*\s*[:\-–—]?\s*/i, '')
          .replace(/^«|»$/g, '')
          .trim();
        if (!courseTitle) {
          courseTitle = fallback.titre_de_tache.replace(/^Consolidation\s*\d+\s*:\s*/i, '').trim();
        }
        var titreFinal = 'Consolidation ' + consolNum + ' : ' + courseTitle;

        var rawRappelSource = raw && (raw.rappel_items || raw.Rappel);
        var rawRappel = Array.isArray(rawRappelSource)
          ? rawRappelSource
          : typeof rawRappelSource === 'string'
            ? rawRappelSource.split(/\r?\n|;/)
            : [];

        var rappelClean = rawRappel
          .map(function (item) { return stripArabic(item).trim(); })
          .filter(Boolean)
          .map(function (item) { return ensureLeadingDash(item); });
        var rappelFinal = rappelClean.length > 0 ? rappelClean : fallback.rappel_items;

        var consolObj = stripArabic(
          (raw && (raw.consolidation_objectif || raw.Consolidation || raw.objectif)) || ''
        ).trim();
        if (!consolObj) {
          consolObj = 'Consolider et renforcer les acquis des élèves concernant ' + courseTitle.toLowerCase() + '.';
        } else if (!/^consolider\b/i.test(consolObj)) {
          consolObj = 'Consolider ' + consolObj.charAt(0).toLowerCase() + consolObj.slice(1);
        }
        if (!/[.!?]$/.test(consolObj)) consolObj += '.';

        var rawPage = String((raw && (raw.page_consolidation != null ? raw.page_consolidation : raw.Page)) || '').trim();
        var pageMatch = rawPage.match(/\d+/);
        var pageFinal = pageMatch ? pageMatch[0] : rawPage || fallback.page_consolidation;

        var rawExSource = raw && (raw.exercices_consolidation || raw.Exercice);
        var rawExList = Array.isArray(rawExSource)
          ? rawExSource
          : typeof rawExSource === 'string'
            ? rawExSource.split(/\r?\n/)
            : [];

        var exercicesFinal = rawExList
          .map(function (line) { return stripArabic(line).replace(/^[-•*▪◦]+\s*/, '').trim(); })
          .filter(Boolean)
          .map(function (line, idx) {
            var exMatch = line.match(/^exercice\s*([0-9]+(?:\.[0-9]+)*)\s*[:\-–—]?\s*(.*)$/i);
            if (exMatch) {
              var exNum = exMatch[1].trim();
              var exDemand = (exMatch[2] || '').trim() || 'Résoudre la tâche demandée.';
              return 'Exercice ' + exNum + ' : ' + exDemand;
            }
            return 'Exercice ' + (idx + 1) + ' : ' + line;
          });

        var rawLecon = String((raw && raw.numero_lecon != null ? raw.numero_lecon : '')).replace(/[^\d]/g, '').trim();
        var rawPeriode = String((raw && raw.periode != null ? raw.periode : '')).replace(/[^\d]/g, '').trim();
        var rawTache = String((raw && raw.numero_tache != null ? raw.numero_tache : '')).replace(/[^\d]/g, '').trim();

        return {
          isConsolidation: true,
          pptTitle: pptBaseTitle || titreFinal,
          ppt_title: pptBaseTitle || titreFinal,
          titre_de_tache: titreFinal,
          objectif: consolObj,
          consolidation_objectif: consolObj,
          numero_lecon: rawLecon ? String(parseInt(rawLecon, 10)) : fallback.numero_lecon,
          periode: rawPeriode ? String(parseInt(rawPeriode, 10)) : fallback.periode,
          numero_tache: rawTache ? String(parseInt(rawTache, 10)) : fallback.numero_tache,
          page_consolidation: pageFinal,
          rappel_items: rappelFinal,
          exercices_consolidation:
            exercicesFinal.length > 0 ? exercicesFinal : fallback.exercices_consolidation
        };
      }

      /**

       */
      async function analyzeConsolidationImageWithGemini(apiKey, fileName, imageDataUrl) {
        var match = String(imageDataUrl || '').match(/^data:([^;]+);base64,(.+)$/);
        if (!match) {
          throw new Error("Format d'image invalide pour l'analyse multimodale.");

        var mimeType = match[1] || 'image/jpeg';

          '  "periode": "...",\n' +
          '  "numero_tache": "...",\n' +
          '  "rappel_items": ["..."],\n' +

          '  "page_consolidation": "...",\n' +
          '  "exercices_consolidation": ["Exercice 1 : ..."]\n' +
          '}';

        var primaryModel = 'gemini-3-flash-preview';
        var endpoint =
          'https://generativelanguage.googleapis.com/v1beta/models/' +
          encodeURIComponent(primaryModel) +
          ':generateContent?key=' +
          encodeURIComponent(apiKey);
        var response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [
              {
                role: 'user',

                  { text: prompt },

if (!response.ok) {

        var rawText =
          (data &&
            data.candidates &&

            data.candidates[0].content.parts[0] &&
            data.candidates[0].content.parts[0].text) ||
          '';
        var jsonMatch = rawText.match(/\{[\s\S]*\}/);
        var parsed = JSON.parse(jsonMatch ? jsonMatch[0] : rawText);
        return normalizeConsolidationResult(parsed, fileName);
      }

      /**
       * Normalizes extracted standard lesson fields and enforces linguistic and formatting rules.
       */
      function normalizeFicheResult(raw, fileName, slides) {
        var fallback = buildFallbackFicheFromSlides(fileName, slides);
        var localMeta = extractCourseMetadataAndBinomePage(fileName, slides);
        var pptBaseTitle = extractPptFilenameTitle(fileName, fallback.titre_de_tache);

        var titreTache =
          stripActivityAndRituelleWords((raw && raw.titre_de_tache) || '') || fallback.titre_de_tache;

        var rawLecon = String((raw && raw.numero_lecon != null ? raw.numero_lecon : '')).replace(/[^\d]/g, '').trim();
        var numeroLecon = rawLecon ? String(parseInt(rawLecon, 10)) : localMeta.numero_lecon;

        var rawPeriode = String((raw && raw.periode != null ? raw.periode : '')).replace(/[^\d]/g, '').trim();
        var periodeVal = rawPeriode ? String(parseInt(rawPeriode, 10)) : localMeta.periode;

        var rawTache = String((raw && raw.numero_tache != null ? raw.numero_tache : '')).replace(/[^\d]/g, '').trim();
        var numeroTache = rawTache ? String(parseInt(rawTache, 10)) : localMeta.numero_tache;

        var prerequis = stripActivityAndRituelleWords((raw && raw.activite_prerequis) || '');
        if (!prerequis) {
          prerequis = fallback.activite_prerequis;
        } else {
          if (
            !/^(effectuer|calculer|appliquer|déterminer|identifier|résoudre|comparer|classer|utiliser)\b/i.test(
              prerequis
            )
          ) {
            prerequis = 'Effectuer ' + prerequis.charAt(0).toLowerCase() + prerequis.slice(1);
          }
          if (!/[.!?]$/.test(prerequis)) prerequis += '.';
          prerequis = ensureLeadingDash(prerequis);
        }

        var defsSource = raw && raw.definitions_et_proprietes;
        var defsArray = Array.isArray(defsSource)
          ? defsSource.map(function (d) { return cleanTopicTitle(d); }).filter(Boolean)
          : typeof defsSource === 'string'
            ? defsSource
                .split(/\r?\n|;/)
                .map(function (d) { return cleanTopicTitle(d); })
                .filter(Boolean)
            : [];

        var uniqueDefs = [];
        var seenDefs = {};
        for (var i = 0; i < defsArray.length; i++) {
          var item = defsArray[i];
          var k = item.toLowerCase();
          if (!seenDefs[k]) {
            seenDefs[k] = true;
            uniqueDefs.push(item);
          }
        }

        var basisText =
          uniqueDefs.length > 0
            ? uniqueDefs.map(function (d) { return d.toLowerCase(); }).join(' et ')
            : '';

        var rawGuidee = stripActivityAndRituelleWords((raw && raw.activite_guidee) || '');
        var guidee = smoothGuideePhrase(rawGuidee, basisText, titreTache);

        var effectiveMethodText = basisText || titreTache.toLowerCase();
        var rawBinome = String((raw && raw.activite_binome) || '');
        var binomeQuestionPrompt = extractQuestionPromptOnly(
          rawBinome,
          'Compléter les égalités suivantes'
        );
        var binomeMethodMatch = stripActivityAndRituelleWords(rawBinome).match(
          /(en utilisant[\s\S]*?)(?:[.!?]|$)/i
        );
        var binomeUsage = binomeMethodMatch
          ? binomeMethodMatch[1].trim().replace(/[.?!]+$/g, '')
          : 'en utilisant ' + effectiveMethodText;
        var binomeFinal = binomeQuestionPrompt + ' : ' + binomeUsage + '.';

        var autonomeFinal =
          extractQuestionPromptOnly(
            (raw && raw.activite_autonome) || '',
            'Compléter les égalités suivantes'
          ) + ' :';

        var errSource = raw && raw.erreurs_eleves;
        var erreursList = Array.isArray(errSource)
          ? errSource.map(function (e) { return stripActivityAndRituelleWords(e); }).filter(Boolean)
          : typeof errSource === 'string'
            ? errSource
                .split(/\r?\n|;/)
                .map(function (e) { return stripActivityAndRituelleWords(e); })
                .filter(Boolean)
            : [];

        if (erreursList.length === 0) {
          erreursList = fallback.erreurs_eleves.slice();
        } else if (erreursList.length === 1) {
          erreursList.push(fallback.erreurs_eleves[0]);
        } else {
          erreursList = erreursList.slice(0, 2);
        }

        var rawPageBinome = parseInt(raw && raw.page_binome, 10);
        var detectedBinomePage =
          !isNaN(rawPageBinome) && rawPageBinome > 0
            ? rawPageBinome
            : localMeta.binomePage;

        var pageN = detectedBinomePage !== null ? detectedBinomePage : 36;

        return {
          isConsolidation: false,
          pptTitle: pptBaseTitle,
          ppt_title: pptBaseTitle,
          titre_de_tache: titreTache,
          objectif: titreTache,
          numero_lecon: numeroLecon,
          periode: periodeVal,
          numero_tache: numeroTache,
          activite_prerequis: prerequis,
          definitions_et_proprietes: uniqueDefs,
          activite_guidee: guidee,
          activite_binome: binomeFinal,
          activite_autonome: autonomeFinal,
          erreurs_eleves: erreursList,
          exercices_maison: buildHomeworkLine(detectedBinomePage),
          pageN: pageN,
          pageNMinus1: pageN - 1,
          pageNMinus2: pageN - 2
        };
      }

/**
       * Triggers download of a standalone editable .htm file named:
       * - "Consolidation <number>.htm" for Consolidation
       * - "<PPT_Title>.htm" for lesson fiches
       */
      function downloadFicheElementAsHtm(sheetEl, ficheObj, sectionName) {
        if (!sheetEl) return;
        var fileName = buildFicheHtmFileName(ficheObj, sectionName);
        var htmlContent = buildStandaloneEditableHtmDocument(
          sheetEl.outerHTML,
          getFicheIdentityTitle(ficheObj, sectionName)
        );

        var blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        showToast('Fichier "' + fileName + '" enregistré et téléchargé.', 'success');
      }

      /**
       * Attaches login and registration listeners including Hajar / 1947 admin shortcut and frozen check.
       */
      function attachLoginListeners() {
        var tabLogin = document.getElementById('tab-login');
        var tabRegister = document.getElementById('tab-register');
        var form = document.getElementById('auth-form');
        var nameInput = document.getElementById('input-name');
        var passInput = document.getElementById('input-password');
        var errorBox = document.getElementById('auth-error');

        if (tabLogin) {
          tabLogin.addEventListener('click', function () {
            state.authMode = 'login';
            window.renderApp();
          });
        }

        if (tabRegister) {
          tabRegister.addEventListener('click', function () {
            state.authMode = 'register';
            window.renderApp();
          });
        }

        if (!form) return;

        form.addEventListener('submit', async function (e) {
          e.preventDefault();
          try {
            var rawName = ((nameInput && nameInput.value) || '').trim();
            var rawPass = ((passInput && passInput.value) || '').trim();

            if (!rawName || !rawPass) {
              errorBox.textContent = 'يرجى إدخال الاسم وكلمة المرور — Veuillez saisir le nom et le mot de passe.';
              errorBox.classList.remove('hidden');
              return;
            }

            errorBox.classList.add('hidden');

            if (state.authMode === 'login' && rawName.toLowerCase() === 'hajar' && rawPass === '1947') {
              state.currentUser = rawName;
              state.isAdmin = true;
              state.openedFromSavedList = false;
              showToast('Bienvenue Hajar — Accès Pages Admin', 'success');
              navigateTo('admin');
              return;
            }

            var existingUser = state.users.find(function (u) {
              return (u.name || '').toLowerCase() === rawName.toLowerCase();
            });

            if (state.authMode === 'register') {
              if (existingUser) {
                errorBox.textContent = 'الاسم "' + rawName + '" مستعمل مسبقاً — Ce nom d\'utilisateur existe déjà.';
                errorBox.classList.remove('hidden');
                return;
              }

              var newUser = {
                id: String(Date.now()),
                name: rawName,
                password: rawPass,
                passwordMask: '•'.repeat(Math.max(8, Math.min(13, rawPass.length + 4))),
                frozen: false,
                active: true
              };

              await saveUserToStore(newUser);
              state.currentUser = rawName;
              state.isAdmin = false;
              state.openedFromSavedList = false;
              showToast('تم إنشاء الحساب بنجاح — Bienvenue ' + rawName, 'success');
              navigateTo('accueil');
              return;
            }

            if (!existingUser) {
              errorBox.textContent = 'الحساب غير موجود — Compte introuvable. Veuillez créer un compte.';
              errorBox.classList.remove('hidden');
              return;
            }

            if (existingUser.frozen) {
              errorBox.textContent = 'هذا الحساب مجمد — Ce compte est gelé par l’administrateur.';
              errorBox.classList.remove('hidden');
              return;
            }

            if (existingUser.password && existingUser.password !== rawPass) {
              errorBox.textContent = 'كلمة المرور غير صحيحة — Mot de passe incorrect.';
              errorBox.classList.remove('hidden');
              return;
            }

            state.currentUser = existingUser.name;
            state.isAdmin = false;
            state.openedFromSavedList = false;
            showToast('مرحباً ' + existingUser.name + ' — Connexion réussie', 'success');
            navigateTo('accueil');
          } catch (err) {
            console.error('Authentication error:', err);
            showDiagnosticError(err.message || 'Erreur lors de la connexion.');
            errorBox.textContent = 'حدث خطأ أثناء العملية — Une erreur est survenue.';
            errorBox.classList.remove('hidden');
          }
        });
      }

      /**
       * Attaches upload and analysis listeners on 'upload' screen.
       */
      function attachUploadListeners() {
        var backBtn = document.getElementById('btn-back-accueil');
        var dropzone = document.getElementById('upload-dropzone');
        var fileInput = document.getElementById('file-upload-input');
        var createBtn = document.getElementById('btn-create-fiche');
        var clearFileBtn = document.getElementById('btn-clear-file');
        var isConsolidation = state.selectedSection === 'Consolidation';

        if (backBtn) {
          backBtn.addEventListener('click', function () {
            navigateTo('accueil');
          });
        }

        var handleFiles = async function (files) {
          if (!files || !files.length) return;
          var picked = files[0];

          if (
            isConsolidation &&
            !String(picked.type || '').startsWith('image/') &&
            !/\.(png|jpe?g|webp|gif|bmp)$/i.test(picked.name)
          ) {
            showToast('Veuillez sélectionner une image valide pour Consolidation.', 'warning');
            return;
          }

          state.openedFromSavedList = false;
          state.uploadedFile = {
            name: picked.name,
            size: picked.size,
            type: picked.type || 'application/octet-stream',
            rawFile: picked,
            imageDataUrl: ''
          };
          state.parsedSlides = [];
          state.generatedFiche = null;
          state.originalFicheBackup = null;
          state.analysisError = '';

          if (isConsolidation) {
            try {
              state.uploadedFile.imageDataUrl = await readFileAsDataURL(picked);
              showToast('Image chargée : ' + picked.name, 'info');
            } catch (err) {
              console.warn('Image read warning:', err);
              showToast('Image sélectionnée : ' + picked.name, 'info');
            }
          } else if (/\.pptx$/i.test(picked.name)) {
            try {
              var slides = await parsePptxSlides(picked);
              state.parsedSlides = slides;
              showToast('Fichier PPTX chargé (' + slides.length + ' diapositives)', 'info');
            } catch (err) {
              console.warn('PPTX pre-parse warning:', err);
              showToast('Fichier sélectionné : ' + picked.name, 'info');
            }
          } else {
            showToast('Fichier sélectionné : ' + picked.name, 'info');
          }

          window.renderApp();
        };

        if (dropzone && fileInput) {
          dropzone.addEventListener('click', function (e) {
            if (clearFileBtn && clearFileBtn.contains(e.target)) return;
            fileInput.click();
          });

          dropzone.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              fileInput.click();
            }
          });

          fileInput.addEventListener('change', function (e) {
            void handleFiles(e.target.files);
          });

          ['dragenter', 'dragover'].forEach(function (evtName) {
            dropzone.addEventListener(evtName, function (e) {
              e.preventDefault();
              e.stopPropagation();
              dropzone.classList.add('drag-over');
            });
          });

          ['dragleave', 'drop'].forEach(function (evtName) {
            dropzone.addEventListener(evtName, function (e) {
              e.preventDefault();
              e.stopPropagation();
              dropzone.classList.remove('drag-over');
            });
          });

          dropzone.addEventListener('drop', function (e) {
            var dt = e.dataTransfer;
            if (dt && dt.files) {
              void handleFiles(dt.files);
            }
          });
        }

        if (clearFileBtn && fileInput) {
          clearFileBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            state.uploadedFile = null;
            state.parsedSlides = [];
            state.generatedFiche = null;
            state.originalFicheBackup = null;
            state.analysisError = '';
            fileInput.value = '';
            window.renderApp();
          });
        }

        if (createBtn) {
          createBtn.addEventListener('click', async function () {
            if (!state.uploadedFile || !state.uploadedFile.rawFile) {
              showToast(
                isConsolidation
                  ? 'Veuillez sélectionner une image via UPLOAD.'
                  : 'Veuillez sélectionner un fichier via UPLOAD.',
                'warning'
              );
              if (fileInput) fileInput.click();
              return;
            }

            state.isAnalyzing = true;
            state.analysisError = '';
            window.renderApp();

            try {
              var activeApiKey = (state.geminiApiKey || readLocalApiKey() || '').trim();

              if (isConsolidation) {
                var dataUrl =
                  state.uploadedFile.imageDataUrl ||
                  (await readFileAsDataURL(state.uploadedFile.rawFile));
                state.uploadedFile.imageDataUrl = dataUrl;

                if (activeApiKey) {
                  state.generatedFiche = await analyzeConsolidationImageWithGemini(
                    activeApiKey,
                    state.uploadedFile.name,
                    dataUrl
                  );
                  showToast('Fiche de consolidation générée avec Gemini.', 'success');
                } else {
                  state.generatedFiche = buildFallbackConsolidationFiche(state.uploadedFile.name);
                  showToast('Fiche de consolidation générée (modèle local).', 'info');
                }

                state.originalFicheBackup = JSON.parse(JSON.stringify(state.generatedFiche));
                state.isAnalyzing = false;
                navigateTo('preview');
                return;
              }

              var slides = state.parsedSlides;
              if (!slides || slides.length === 0) {
                if (/\.pptx$/i.test(state.uploadedFile.name)) {
                  slides = await parsePptxSlides(state.uploadedFile.rawFile);
                } else {
                  var textContent = await state.uploadedFile.rawFile.text().catch(function () { return ''; });
                  slides = [{ slideNumber: 1, text: textContent.slice(0, 8000) }];
                }
                state.parsedSlides = slides;
              }

              if (activeApiKey) {
                state.generatedFiche = await analyzeSlidesWithGemini(
                  activeApiKey,
                  state.uploadedFile.name,
                  slides
                );
                showToast('Fiche pédagogique générée avec Gemini.', 'success');
              } else {
                state.generatedFiche = buildFallbackFicheFromSlides(
                  state.uploadedFile.name,
                  slides
                );
                showToast('Fiche générée (analyse locale).', 'info');
              }

              state.originalFicheBackup = JSON.parse(JSON.stringify(state.generatedFiche));
              state.isAnalyzing = false;
              navigateTo('preview');
            } catch (err) {
              console.error('Fiche generation error:', err);
              state.analysisError = "Erreur d'analyse : " + (err.message || 'Impossible de traiter le fichier.');
              if (isConsolidation) {
                state.generatedFiche = buildFallbackConsolidationFiche(state.uploadedFile.name);
              } else {
                state.generatedFiche = buildFallbackFicheFromSlides(
                  state.uploadedFile.name,
                  state.parsedSlides || []
                );
              }
              state.originalFicheBackup = JSON.parse(JSON.stringify(state.generatedFiche));
              showToast('Extraction locale appliquée.', 'warning');
              state.isAnalyzing = false;
              navigateTo('preview');
            }
          });
        }
      }

      /**
       * Attaches handlers for the 'preview' screen.
       */
      function attachPreviewListeners() {
        var backToUploadBtn = document.getElementById('btn-back-to-upload');
        var returnToSavedBtn = document.getElementById('btn-return-to-saved-fiches');
        var downloadPdfBtn = document.getElementById('btn-download-saved-pdf');
        var printBtn = document.getElementById('btn-print-fiche');
        var toggleEditBtn = document.getElementById('btn-toggle-edit-fiche');
        var resetEditBtn = document.getElementById('btn-reset-edit-fiche');
        var saveEditBtn = document.getElementById('btn-save-edit-fiche');

        var goBackToSavedFiches = function () {
          state.openedFromSavedList = false;
          state.showReadyFichesModal = true;
          navigateTo(state.isAdmin ? 'admin' : 'accueil');
        };

        var syncEditedFicheFromDom = function () {
          if (!state.generatedFiche) return;
          var leconEl = document.getElementById('fiche-field-lecon');
          var periodeEl = document.getElementById('fiche-field-periode');
          var tacheEl = document.getElementById('fiche-field-tache');
          var titreEl = document.getElementById('fiche-field-titre');
          var objectifEl = document.getElementById('fiche-field-objectif');

          if (leconEl) state.generatedFiche.numero_lecon = leconEl.innerText.trim();
          if (periodeEl) state.generatedFiche.periode = periodeEl.innerText.trim();
          if (tacheEl) state.generatedFiche.numero_tache = tacheEl.innerText.trim();
          if (titreEl) state.generatedFiche.titre_de_tache = titreEl.innerText.trim();
          if (objectifEl) state.generatedFiche.objectif = objectifEl.innerText.trim();

          if (state.generatedFiche.isConsolidation) {
            if (objectifEl) state.generatedFiche.consolidation_objectif = objectifEl.innerText.trim();
            var consolPageEl = document.getElementById('fiche-field-consol-page');
            var consolRappelEl = document.getElementById('fiche-field-consol-rappel');
            var consolExEl = document.getElementById('fiche-field-consol-exercices');

            if (consolPageEl) state.generatedFiche.page_consolidation = consolPageEl.innerText.trim();
            if (consolRappelEl) {
              var linesR = consolRappelEl.innerText
                .split(/\r?\n/)
                .map(function (l) { return l.trim(); })
                .filter(Boolean);
              if (linesR.length > 0) state.generatedFiche.rappel_items = linesR;
            }
            if (consolExEl) {
              var linesE = consolExEl.innerText
                .split(/\r?\n/)
                .map(function (l) { return l.trim(); })
                .filter(Boolean);
              if (linesE.length > 0) state.generatedFiche.exercices_consolidation = linesE;
            }
            return;
          }

          var prereqEl = document.getElementById('fiche-field-prerequis');
          var guideeEl = document.getElementById('fiche-field-guidee');
          var binomeEl = document.getElementById('fiche-field-binome');
          var autonomeEl = document.getElementById('fiche-field-autonome');
          var erreursEl = document.getElementById('fiche-field-erreurs');
          var exercicesEl = document.getElementById('fiche-field-exercices');
          var defsEl = document.getElementById('fiche-field-defs');

          if (prereqEl) state.generatedFiche.activite_prerequis = prereqEl.innerText.trim();
          if (guideeEl) state.generatedFiche.activite_guidee = guideeEl.innerText.trim();
          if (binomeEl) state.generatedFiche.activite_binome = binomeEl.innerText.trim();
          if (autonomeEl) state.generatedFiche.activite_autonome = autonomeEl.innerText.trim();
          if (exercicesEl) state.generatedFiche.exercices_maison = exercicesEl.innerText.trim();
          if (erreursEl) {
            var linesErr = erreursEl.innerText
              .split(/\r?\n/)
              .map(function (l) { return l.replace(/^[-•\s]+/, '').trim(); })
              .filter(Boolean);
            if (linesErr.length > 0) state.generatedFiche.erreurs_eleves = linesErr;
          }
          if (defsEl) {
            var topics = defsEl.innerText
              .split(/\r?\n/)
              .map(function (l) { return l.replace(/^[•\-\s]+/, '').trim(); })
              .filter(Boolean);
            if (topics.length > 0) state.generatedFiche.definitions_et_proprietes = topics;
          }
        };

        if (backToUploadBtn) {
          backToUploadBtn.addEventListener('click', function () {
            if (state.openedFromSavedList) {
              goBackToSavedFiches();
              return;
            }
            syncEditedFicheFromDom();
            navigateTo('upload');
          });
        }

        if (returnToSavedBtn) {
          returnToSavedBtn.addEventListener('click', goBackToSavedFiches);
        }

        if (downloadPdfBtn) {
          downloadPdfBtn.addEventListener('click', function () {
            window.print();
          });
        }
if (toggleEditBtn) {
          toggleEditBtn.addEventListener('click', function () {
            syncEditedFicheFromDom();
            state.ficheEditEnabled = !state.ficheEditEnabled;
            window.renderApp();
            showToast(
              state.ficheEditEnabled
                ? 'Édition active : modifiez directement les cellules.'
                : 'Mode lecture seule activé.',
              'info'
            );
          });
        }

        if (resetEditBtn) {
          resetEditBtn.addEventListener('click', function () {
            if (state.originalFicheBackup) {
              state.generatedFiche = JSON.parse(JSON.stringify(state.originalFicheBackup));
              window.renderApp();
              showToast('Modifications réinitialisées.', 'info');
            }
          });
        }

        if (saveEditBtn) {
          saveEditBtn.addEventListener('click', async function () {
            syncEditedFicheFromDom();
            var sectionName = state.selectedSection || 'premier pages';
            var identityTitle = getFicheIdentityTitle(state.generatedFiche, sectionName);
            var titleKey = normalizeFicheTitleKey(identityTitle);

            var alreadyExists = state.savedFiches.some(function (item) {
              return normalizeFicheTitleKey(item.title) === titleKey;
            });

            if (alreadyExists) {
              showToast('deja exist', 'warning');
              return;
            }

            var record = {
              id: 'fiche_' + Date.now(),
              title: identityTitle,
              section: sectionName,
              fiche: JSON.parse(JSON.stringify(state.generatedFiche)),
              updatedAt: new Date().toISOString()
            };

            await persistSavedFicheRecord(record);
            var sheetEl = document.getElementById('fiche-editable-sheet');
            if (sheetEl) {
              downloadFicheElementAsHtm(sheetEl, state.generatedFiche, sectionName);
            }
          });
        }
      }

              '  <input id="api-key-input" type="password" value="' + escapeHtml(state.geminiApiKey) + '" placeholder="AIza..." class="w-full rounded-xl bg-white px-3.5 py-2.5 text-sm font-semibold text-[#111625] border border-slate-200 focus:outline-none focus:border-[#1857b8]" style="width:100%;border-radius:12px;background:#ffffff;padding:10px 14px;border:1px solid #cbd5e1;margin-bottom:10px;" />' +
              '  <button type="submit" id="save-api-key-btn" class="w-full py-2.5 rounded-xl bg-[#1857b8] hover:bg-[#134696] text-white text-sm font-bold transition-colors cursor-pointer" style="width:100%;padding:10px;border-radius:12px;background:#1857b8;color:#ffffff;font-weight:700;border:none;cursor:pointer;">save key</button>' +
              '</form>'
            : '') +
          (state.showAddUserModal
            ? '<form id="add-user-form" class="mb-5 rounded-2xl bg-[#eceef1] p-4 border border-slate-200 space-y-3" style="margin-bottom:20px;border-radius:16px;background:#eceef1;padding:16px;border:1px solid #e2e8f0;">' +
              '  <div class="flex items-center justify-between" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">' +
              '    <span class="text-sm font-bold text-[#111625]">Nouvel utilisateur</span>' +
              '    <button type="button" id="close-add-user" class="text-xs font-bold text-[#6f7787] hover:text-[#111625] cursor-pointer" style="background:transparent;border:none;font-size:12px;font-weight:700;cursor:pointer;">Fermer</button>' +
              '  </div>' +
              '  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">' +
              '    <input id="new-user-name" type="text" placeholder="Nom" class="rounded-xl bg-white px-3.5 py-2.5 text-sm font-semibold text-[#111625] border border-slate-200 focus:outline-none focus:border-[#1857b8]" style="width:100%;border-radius:12px;background:#ffffff;padding:10px 14px;border:1px solid #cbd5e1;" />' +
              '    <input id="new-user-pass" type="password" placeholder="Mot de passe" class="rounded-xl bg-white px-3.5 py-2.5 text-sm font-semibold text-[#111625] border border-slate-200 focus:outline-none focus:border-[#1857b8]" style="width:100%;border-radius:12px;background:#ffffff;padding:10px 14px;border:1px solid #cbd5e1;" />' +
              '  </div>' +
              '  <button type="submit" class="w-full py-2.5 rounded-xl bg-[#1857b8] hover:bg-[#134696] text-white text-sm font-bold transition-colors cursor-pointer" style="width:100%;padding:10px;border-radius:12px;background:#1857b8;color:#ffffff;font-weight:700;border:none;cursor:pointer;">Ajouter l\'utilisateur</button>' +
              '</form>'
            : '') +
          '  <div class="grid grid-cols-12 items-center text-[15px] font-medium text-[#7d8594] pb-3 border-b border-slate-200 px-1" style="display:grid;grid-template-columns:3fr 4fr 5fr;align-items:center;font-size:14px;color:#7d8594;padding:0 4px 12px 4px;border-bottom:1px solid #e2e8f0;">' +
          '    <div class="col-span-3">Nom</div>' +
          '    <div class="col-span-4 text-center" style="text-align:center;">Mot de passe</div>' +
          '    <div class="col-span-5 text-right pr-2" style="text-align:right;padding-right:8px;">Actions</div>' +
          '  </div>' +
          '  <div id="admin-user-rows" class="divide-y divide-slate-200/90">' +
          rowsHtml +
          '  </div>' +
          renderSavedFichesModalHtml() +
          '</section>'
        );
      }
/**
       * Attaches admin screen event listeners.
       */
      function attachAdminListeners() {
        var logoutBtn = document.getElementById('admin-logout-btn');
        var fichesBtn = document.getElementById('admin-fiches-btn');
        var networkBtn = document.getElementById('admin-network-btn');
        var starBtn = document.getElementById('admin-star-btn');
        var keyBtn = document.getElementById('admin-key-btn');
        var toggleAddBtn = document.getElementById('btn-toggle-add-user');
        var rowsContainer = document.getElementById('admin-user-rows');

        if (logoutBtn) {
          logoutBtn.addEventListener('click', function () {
            state.currentUser = null;
            state.isAdmin = false;
            state.openedFromSavedList = false;
            state.showReadyFichesModal = false;
            state.showAddUserModal = false;
            state.showApiKeyModal = false;
            state.adminFilterActiveOnly = false;
            navigateTo('login');
          });
        }

        if (fichesBtn) {
          fichesBtn.addEventListener('click', function () {
            state.showReadyFichesModal = true;
            window.renderApp();
            void hydrateFromFirestore();
          });
        }

        attachSavedFichesModalListeners();

        if (networkBtn) {
          networkBtn.addEventListener('click', function () {
            state.adminFilterActiveOnly = !state.adminFilterActiveOnly;
            window.renderApp();
            showToast(
              state.adminFilterActiveOnly
                ? 'Affichage des utilisateurs actifs (non gelés)'
                : 'Affichage de tous les utilisateurs',
              'info'
            );
          });
        }

        if (starBtn) {
          starBtn.addEventListener('click', function () {
            state.showAddUserModal = false;
            state.showApiKeyModal = false;
            navigateTo('accueil');
          });
        }

        if (keyBtn) {
          keyBtn.addEventListener('click', function () {
            state.showApiKeyModal = !state.showApiKeyModal;
            if (state.showApiKeyModal) state.showAddUserModal = false;
            window.renderApp();
          });
        }

        if (toggleAddBtn) {
          toggleAddBtn.addEventListener('click', function () {
            state.showAddUserModal = !state.showAddUserModal;
            if (state.showAddUserModal) state.showApiKeyModal = false;
            window.renderApp();
          });
        }

        var apiKeyForm = document.getElementById('api-key-form');
        var closeApiKeyBtn = document.getElementById('close-api-key');

        if (closeApiKeyBtn) {
          closeApiKeyBtn.addEventListener('click', function () {
            state.showApiKeyModal = false;
            window.renderApp();
          });
        }

        if (apiKeyForm) {
          apiKeyForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            var inputEl = document.getElementById('api-key-input');
            var keyVal = ((inputEl && inputEl.value) || '').trim();
            if (!keyVal) {
              showToast('Veuillez saisir une clé API valide.', 'warning');
              return;
            }
            await saveApiKeyToStore(keyVal);
            state.showApiKeyModal = false;
            window.renderApp();
            showToast('API key enregistrée.', 'success');
          });
        }

        var addForm = document.getElementById('add-user-form');
        var closeAddBtn = document.getElementById('close-add-user');

        if (closeAddBtn) {
          closeAddBtn.addEventListener('click', function () {
            state.showAddUserModal = false;
            window.renderApp();
          });
        }

        if (addForm) {
          addForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            var nameEl = document.getElementById('new-user-name');
            var passEl = document.getElementById('new-user-pass');
            var nameVal = ((nameEl && nameEl.value) || '').trim();
            var passVal = ((passEl && passEl.value) || '').trim();

            if (!nameVal || !passVal) {
              showToast('Veuillez saisir un nom et un mot de passe.', 'warning');
              return;
            }

            var exists = state.users.some(function (u) {
              return (u.name || '').toLowerCase() === nameVal.toLowerCase();
            });
            if (exists) {
              showToast('L\'utilisateur "' + nameVal + '" existe déjà.', 'warning');
              return;
            }

            var newUser = {
              id: String(Date.now()),
              name: nameVal,
              password: passVal,
              passwordMask: '•'.repeat(Math.max(7, Math.min(13, passVal.length + 3))),
              frozen: false,
              active: true
            };

            await saveUserToStore(newUser);
            state.showAddUserModal = false;
            window.renderApp();
            showToast('Utilisateur "' + nameVal + '" ajouté.', 'success');
          });
        }

        if (rowsContainer) {
          rowsContainer.addEventListener('click', async function (e) {
            var btn = e.target.closest('button[data-action]');
            if (!btn) return;

            var action = btn.getAttribute('data-action');
            var id = btn.getAttribute('data-id');
            var targetUser = state.users.find(function (u) { return String(u.id) === String(id); });
            if (!targetUser) return;

            if (action === 'delete') {
              await deleteUserFromStore(id);
              window.renderApp();
              showToast('"' + targetUser.name + '" supprimé.', 'error');
            } else if (action === 'freeze') {
              var nextFrozen = !targetUser.frozen;
              await updateUserInStore(id, { frozen: nextFrozen, active: !nextFrozen });
              window.renderApp();
              showToast(
                nextFrozen
                  ? 'Compte de "' + targetUser.name + '" gelé.'
                  : 'Compte de "' + targetUser.name + '" réactivé.',
                'warning'
              );
            }
          });
        }
      }
 /**
       * Global synchronous window.renderApp orchestrator managing all 5 screens
       * ('login', 'accueil', 'upload', 'preview', 'admin').
       */
      function renderApp() {
        try {
          var container = screenContainer || document.getElementById('screen-container');
          if (!container) return;

          var html = '';
          if (state.screen === 'login') {
            html = renderLoginScreen();
          } else if (state.screen === 'accueil') {
            html = renderAccueilScreen();
          } else if (state.screen === 'upload') {
            html = renderUploadScreen();
          } else if (state.screen === 'preview') {
            html = renderPreviewScreen();
          } else if (state.screen === 'admin') {
            html = renderAdminScreen();
          } else {
            state.screen = 'login';
            html = renderLoginScreen();
          }

          container.innerHTML = html;

          if (state.screen === 'login') {
            attachLoginListeners();
          } else if (state.screen === 'accueil') {
            attachAccueilListeners();
          } else if (state.screen === 'upload') {
            attachUploadListeners();
          } else if (state.screen === 'preview') {
            attachPreviewListeners();
          } else if (state.screen === 'admin') {
            attachAdminListeners();
          } else {
            attachLoginListeners();
          }
        } catch (err) {
          console.error('Render fallback error:', err);
          showDiagnosticError(err.message || 'Erreur de rendu.');
          var container = screenContainer || document.getElementById('screen-container');
          if (container) {
            container.innerHTML =
              '<div class="flex-1 flex flex-col items-center justify-center text-center p-6 space-y-4">' +
              '  <div class="w-14 h-14 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center font-extrabold text-xl">!</div>' +
              '  <p class="text-sm font-bold text-[#111625]">Récupération de l\'interface...</p>' +
              '  <button type="button" id="btn-fallback-recover" class="px-4 py-2.5 rounded-xl bg-[#1857b8] text-white text-sm font-bold cursor-pointer">Recharger Connexion</button>' +
              '</div>';
            var recoverBtn = document.getElementById('btn-fallback-recover');
            if (recoverBtn) {
              recoverBtn.addEventListener('click', function () {
                state.screen = 'login';
                window.renderApp();
              });
            }
          }
        }
      }

      window.renderApp = renderApp;

      // Immediate synchronous render on script evaluation so #screen-container is never blank
      window.renderApp();

      // Background non-blocking initialization on DOMContentLoaded
      window.addEventListener('DOMContentLoaded', function () {
        try {
          window.renderApp();
          void initFirestoreBackground();
        } catch (domErr) {
          console.warn('DOMContentLoaded warning:', domErr);
          showDiagnosticError(domErr.message || 'Erreur au chargement.');
        }
      });
    })();
  </script>
</body>
</html>
