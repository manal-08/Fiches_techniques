<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fiche Pédagogique d'une séance — Espace π</title>
  <!-- Tailwind CSS for responsive layout and utility classes -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- JSZip for client-side .pptx XML slide parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- Google Fonts: Inter & Cairo for UI/Arabic labels; Caveat & Dancing Script for connected cursive accents -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700&family=Caveat:wght@600;700&family=Dancing+Script:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg-canvas: #eef2f8;
      --phone-bg: #ffffff;
      --ink-navy: #111625;
      --muted-gray: #8d95a5;
      --surface-gray: #eceef1;
      --royal-blue: #1857b8;
      --royal-blue-hover: #134696;
      --ouverture-blue: #4f81bd;
      --sheet-white: #ffffff;
      --sheet-ink: #0b0d12;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Cairo', sans-serif;
      background-color: var(--bg-canvas);
      color: var(--ink-navy);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .arabic-label {
      font-family: 'Cairo', 'Inter', sans-serif;
      direction: rtl;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .screen-enter {
      animation: fadeSlideUp 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .bottom-waves {
      position: absolute;
      inset-x: 0;
      bottom: 0;
      height: 120px;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      border-bottom-left-radius: 36px;
      border-bottom-right-radius: 36px;
    }

    @media (max-width: 639px) {
      .bottom-waves {
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
      }
    }

    .upload-dropzone {
      background-color: #eceef1;
      border: 2px solid #d5dae2;
      transition: all 0.2s ease;
    }

    .upload-dropzone-inner {
      border: 1.5px dashed #9aa4b5;
      border-radius: 18px;
      transition: all 0.2s ease;
    }

    .upload-dropzone.drag-over .upload-dropzone-inner {
      border-color: #1857b8;
      background-color: rgba(24, 87, 184, 0.06);
      transform: scale(0.99);
    }

    /* Requested worksheet font-family across all worksheet elements */
    .fiche-sheet,
    .fiche-sheet *,
    .fiche-script-accent,
    .fiche-cursive-italic,
    .fiche-table,
    .fiche-table th,
    .fiche-table td {
      font-family: 'Comic Sans MS', 'Segoe UI', cursive, sans-serif;
    }

    /* Connected cursive accent styling layered cleanly over the worksheet font */
    .fiche-script-accent,
    .fiche-cursive-italic {
      font-family: 'Caveat', 'Dancing Script', 'Comic Sans MS', 'Segoe UI', cursive, sans-serif;
    }

    /* Borderless outer sheet while keeping all inner table cell borders intact */
    .fiche-sheet {
      background: var(--sheet-white);
      color: var(--sheet-ink);
      border: none;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      page-break-inside: auto;
      break-inside: auto;
    }

    /* Bold and underlined styling for phrases enclosed within «» */
    .fiche-guillemet-bold-ul {
      font-weight: 800;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 2px;
    }

    /* Underline strictly for extracted items in binôme and autonome */
    .fiche-extracted-ul {
      text-decoration: underline;
      text-decoration-thickness: 1.5px;
      text-underline-offset: 2px;
      font-weight: 700;
    }

    .fiche-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      color: var(--sheet-ink);
      page-break-inside: auto;
      break-inside: auto;
    }

    .fiche-table th,
    .fiche-table td {
      border: 1px solid var(--sheet-ink);
      padding: 5px 6px;
      vertical-align: top;
      word-wrap: break-word;
      overflow-wrap: break-word;
      color: var(--sheet-ink);
    }

    /* Repeat table headers naturally across pages */
    .fiche-table thead {
      display: table-header-group;
    }

    /* Natural multi-page flow without forced breaks or large empty gaps */
    .fiche-table tr {
      page-break-inside: auto;
      break-inside: auto;
    }

    /* Alternating #4f81bd and #ffffff header rows */
    .fiche-row-ouverture {
      background-color: var(--ouverture-blue);
      color: #ffffff;
      font-weight: 700;
    }

    .fiche-row-ouverture td,
    .fiche-row-ouverture th {
      background-color: var(--ouverture-blue);
      color: #ffffff;
      border-color: var(--sheet-ink);
    }

    .fiche-row-white {
      background-color: var(--sheet-white);
      color: var(--sheet-ink);
      font-weight: 700;
    }

    .fiche-row-white td,
    .fiche-row-white th {
      background-color: var(--sheet-white);
      color: var(--sheet-ink);
      border-color: var(--sheet-ink);
    }

    .fiche-ouverture-band,
    .fiche-side-band {
      background-color: var(--ouverture-blue);
      color: #ffffff;
      font-weight: 700;
      text-align: center;
      vertical-align: middle !important;
    }

    .fiche-editable-cell[contenteditable="true"] {
      outline: none;
      border-radius: 4px;
      transition: background-color 0.15s ease, box-shadow 0.15s ease;
    }

    .fiche-edit-active .fiche-editable-cell[contenteditable="true"]:hover,
    .fiche-edit-active .fiche-editable-cell[contenteditable="true"]:focus {
      background-color: rgba(24, 87, 184, 0.11);
      box-shadow: inset 0 0 0 1.5px rgba(11, 13, 18, 0.45);
    }

    /* Natural multi-page A4 print flow without forced page breaks or scaling hacks */
    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm;
      }

      body {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
        display: block !important;
        min-height: auto !important;
        color: #0b0d12 !important;
      }

      #app-shell {
        max-width: 100% !important;
        width: 100% !important;
        min-height: auto !important;
        border: none !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        overflow: visible !important;
        background: #ffffff !important;
      }

      #toast-banner,
      #diagnostic-error-banner,
      .bottom-waves,
      .no-print {
        display: none !important;
      }

      .fiche-editable-cell[contenteditable="true"] {
        background-color: transparent !important;
        box-shadow: none !important;
        outline: none !important;
      }

      #screen-container {
        padding: 0 !important;
        overflow: visible !important;
      }

      .fiche-sheet,
      .fiche-sheet *,
      .fiche-script-accent,
      .fiche-cursive-italic,
      .fiche-table,
      .fiche-table th,
      .fiche-table td {
        font-family: 'Comic Sans MS', 'Segoe UI', cursive, sans-serif !important;
      }

      .fiche-sheet {
        border: none !important;
        box-shadow: none !important;
        color: #0b0d12 !important;
        font-size: 11.5px !important;
        line-height: 1.25 !important;
        padding: 4px !important;
        page-break-inside: auto !important;
        break-inside: auto !important;
      }

      .fiche-table {
        page-break-inside: auto !important;
        break-inside: auto !important;
        margin-bottom: 4px !important;
      }

      .fiche-table thead {
        display: table-header-group !important;
      }

      .fiche-table tr {
        page-break-inside: auto !important;
        break-inside: auto !important;
      }

      .fiche-table th,
      .fiche-table td {
        padding: 3.5px 5px !important;
        border-color: #0b0d12 !important;
      }

      .fiche-guillemet-bold-ul,
      .fiche-extracted-ul {
        text-decoration: underline !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .fiche-row-ouverture,
      .fiche-ouverture-band,
      .fiche-side-band {
        background-color: #4f81bd !important;
        color: #ffffff !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .fiche-row-white,
      .fiche-row-white td {
        background-color: #ffffff !important;
        color: #0b0d12 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
  </head>
  <body>
  <!-- Main Application Shell -->
  <main
    id="app-shell"
    class="relative w-full max-w-[420px] min-h-[760px] sm:min-h-[820px] bg-white rounded-none sm:rounded-[38px] shadow-[0_24px_70px_-15px_rgba(17,22,37,0.18)] border border-slate-200/80 overflow-hidden flex flex-col justify-between"
  >
    <!-- Non-blocking Toast Banner -->
    <div
      id="toast-banner"
      role="status"
      aria-live="polite"
      class="hidden fixed sm:absolute top-4 inset-x-4 z-50 rounded-2xl px-4 py-3 text-sm font-semibold shadow-lg border transition-all duration-200 flex items-center justify-between gap-2 no-print"
    >
      <span id="toast-message"></span>
      <button
        type="button"
        id="toast-close"
        aria-label="Fermer la notification"
        class="text-xs opacity-70 hover:opacity-100 p-1 rounded-full cursor-pointer"
      >
        ✕
      </button>
    </div>

    <!-- Diagnostic Runtime Error Banner -->
    <div
      id="diagnostic-error-banner"
      role="alert"
      class="hidden fixed sm:absolute bottom-4 inset-x-4 z-50 rounded-2xl px-4 py-3 text-xs font-bold bg-rose-50 text-rose-900 border border-rose-300 shadow-lg flex items-center justify-between gap-2 no-print"
    >
      <span id="diagnostic-error-text"></span>
      <button
        type="button"
        id="diagnostic-error-close"
        aria-label="Fermer l'alerte"
        class="text-xs px-2 py-1 rounded-lg bg-rose-100 hover:bg-rose-200 cursor-pointer shrink-0"
      >
        OK
      </button>
    </div>

    <!-- Dynamic Screen Container -->
    <div id="screen-container" class="relative z-10 flex-1 flex flex-col px-6 pt-7 pb-28">
      <!-- Rendered immediately via window.renderApp() -->
    </div>

    <!-- Decorative Bottom Waves -->
    <div class="bottom-waves" aria-hidden="true">
      <svg viewBox="0 0 420 130" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full object-cover">
        <path
          d="M0 32C88 10 156 64 252 46C328 32 378 8 420 22V130H0V32Z"
          fill="#DCE7F9"
          fill-opacity="0.72"
        />
        <path
          d="M0 58C105 84 185 28 286 54C352 71 392 52 420 42V130H0V58Z"
          fill="#BED4F7"
          fill-opacity="0.65"
        />
        <path
          d="M0 84C92 68 175 104 278 82C345 68 388 86 420 94V130H0V84Z"
          fill="#9EC0F4"
          fill-opacity="0.45"
        />
      </svg>
    </div>
  </main>

  <script type="module">
    // Storage keys for local persistence and Firestore synchronization
    const STORAGE_KEYS = {
      USERS: 'fiche_tech_users_v1',
      API_KEY: 'fiche_tech_gemini_api_key_v1',
      SAVED_FICHES: 'fiche_tech_saved_fiches_v1'
    };

    // Default seed users for local operation
    const DEFAULT_USERS = [
      { id: '1', name: 'Alice', password: '', passwordMask: '•••••••••', frozen: false, active: true },
      { id: '2', name: 'Benoît', password: '', passwordMask: '••••••••••••', frozen: false, active: true },
      { id: '3', name: 'Claire', password: '', passwordMask: '••••••••', frozen: false, active: false },
      { id: '4', name: 'David', password: '', passwordMask: '•••••••••••', frozen: false, active: true }
    ];

    // Reference headings used during PPTX slide analysis
    const NINE_SECTION_HEADINGS = [
      'Activite prérequis',
      'Définitions et Propriétés',
      'Vérification',
      'Modlage',
      "Déclaration d'objectif",
      'Activité guidee',
      'Activité binôme',
      'Activité autonome',
      'Clôture'
    ];

    const RADICAL_GUIDEE_PHRASE =
      '- Réduire une expression en regroupant les radicaux semblables et en appliquant les règles sur la somme, la différence et la non-additivité des radicaux.';

    // Optional Firebase configuration
    const firebaseConfig = {
      apiKey: 'AIzaSyAtl1H7juxl0NTyGPSTgjm6yg4wJrA5XTo',
      authDomain: 'fiche-tech.firebaseapp.com',
      projectId: 'fiche-tech',
      storageBucket: 'fiche-tech.firebasestorage.app',
      messagingSenderId: '542981358367',
      appId: '1:542981358367:web:6f4cb3a11b6693cb82e62a',
      measurementId: 'G-ST5YXB9L65'
    };

    /**
     * Builds the standardized homework instruction line.
     */
    function buildHomeworkLine(binomePage) {
      const hasPage =
        binomePage !== undefined &&
        binomePage !== null &&
        String(binomePage).trim() !== '' &&
        !Number.isNaN(Number(binomePage));
      const pageSuffix = hasPage ? String(parseInt(binomePage, 10)) : '...';
      return `Faire d'exercice "Je m'entraîne à la maison" page ${pageSuffix}`;
    }

    /**
     * Extracts PPT filename base title (e.g. "P12_..." -> "P12_...") for worksheet identity.
     */
    function extractPptFilenameTitle(fileName, fallbackLabel = '') {
      const rawName = String(fileName || '').trim();
      if (rawName) {
        const withoutExt = rawName.replace(/\.[^.]+$/, '').trim();
        if (withoutExt) return withoutExt;
      }
      return String(fallbackLabel || '').replace(/^«|»$/g, '').trim();
    }

    /**
     * Reads users safely from localStorage with fallback to defaults.
     */
    function readLocalUsers() {
      try {
        const raw = window.localStorage.getItem(STORAGE_KEYS.USERS);
        if (!raw) {
          window.localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(DEFAULT_USERS));
          return DEFAULT_USERS.map((u) => ({ ...u }));
        }
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) && parsed.length > 0
          ? parsed
          : DEFAULT_USERS.map((u) => ({ ...u }));
      } catch {
        return DEFAULT_USERS.map((u) => ({ ...u }));
      }
    }

    /**
     * Writes users safely to localStorage.
     */
    function writeLocalUsers(users) {
      try {
        window.localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users));
      } catch (err) {
        console.warn('localStorage write users warning:', err);
      }
    }

    /**
     * Reads stored Gemini API key safely from localStorage.
     */
    function readLocalApiKey() {
      try {
        return (window.localStorage.getItem(STORAGE_KEYS.API_KEY) || '').trim();
      } catch {
        return '';
      }
    }

    /**
     * Saves or removes Gemini API key in localStorage.
     */
    function writeLocalApiKey(keyVal) {
      try {
        const cleaned = (keyVal || '').trim();
        if (cleaned) {
          window.localStorage.setItem(STORAGE_KEYS.API_KEY, cleaned);
        } else {
          window.localStorage.removeItem(STORAGE_KEYS.API_KEY);
        }
      } catch (err) {
        console.warn('localStorage write apiKey warning:', err);
      }
    }

    /**
     * Reads saved ready-made worksheets safely from localStorage.
     */
    function readLocalSavedFichesList() {
      try {
        const raw = window.localStorage.getItem(STORAGE_KEYS.SAVED_FICHES);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
        if (parsed && typeof parsed === 'object') {
          return Object.entries(parsed)
            .filter(([, val]) => val && typeof val === 'object' && val.fiche)
            .map(([key, val]) => ({
              id: val.id || key,
              title: val.title || val.fiche?.ppt_title || val.fiche?.titre_de_tache || key,
              section: val.section || key,
              fiche: val.fiche,
              updatedAt: val.updatedAt || new Date().toISOString()
            }));
        }
        return [];
      } catch {
        return [];
      }
    }

    /**
     * Writes saved ready-made worksheets safely to localStorage.
     */
    function writeLocalSavedFichesList(list) {
      try {
        window.localStorage.setItem(STORAGE_KEYS.SAVED_FICHES, JSON.stringify(list));
      } catch (err) {
        console.warn('localStorage write saved fiches warning:', err);
      }
    }

    /**
     * Normalizes a worksheet title for duplicate detection.
     */
    function normalizeFicheTitleKey(title) {
      return String(title || '')
        .replace(/^«|»$/g, '')
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase();
    }

    /**
     * Resolves the PPT filename identity (P...) when present, or falls back cleanly.
     */
    function getFicheIdentityTitle(fiche, sectionName) {
      const pptTitle = String(fiche?.ppt_title || '').trim();
      if (pptTitle) return pptTitle;
      return String(fiche?.titre_de_tache || sectionName || 'fiche-pedagogique')
        .replace(/^«|»$/g, '')
        .trim();
    }

    /**
     * Builds the target .htm filename:
     * - For Consolidation: "Consolidation <number>.htm"
     * - For lesson fiches: "<PPT_Title>.htm"
     */
    function buildFicheHtmFileName(fiche, sectionName) {
      const isConsol = Boolean(fiche?.isConsolidation) || sectionName === 'Consolidation';
      if (isConsol) {
        const rawTitle = String(fiche?.titre_de_tache || '').trim();
        const numMatch = rawTitle.match(/consolidation\s*(\d+)/i);
        const num = numMatch?.[1]
          ? numMatch[1]
          : String(fiche?.numero_tache || '1').replace(/[^\d]/g, '') || '1';
        return `Consolidation ${num}.htm`;
      }
      const identityTitle = getFicheIdentityTitle(fiche, sectionName)
        .replace(/[\\/:*?"<>|]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim() || 'fiche-pedagogique';
      return `${identityTitle}.htm`;
    }

    /**
     * Central application state across all 5 screens ('login', 'accueil', 'upload', 'preview', 'admin').
     */
    const state = {
      screen: 'login',
      authMode: 'login', // 'login' | 'register'
      currentUser: null,
      isAdmin: false,
      showSectionChooser: false,
      showReadyFichesModal: false,
      openedSavedFicheMode: false,
      savedFiches: readLocalSavedFichesList(),
      selectedSection: 'premier pages', // 'premier pages' | 'Autre Seance' | 'Consolidation'
      uploadedFile: null, // { name, size, type, rawFile, imageDataUrl }
      parsedSlides: [], // [{ slideNumber, text }]
      generatedFiche: null,
      originalFicheBackup: null,
      isAnalyzing: false,
      analysisError: '',
      ficheEditEnabled: true,
      users: readLocalUsers(),
      geminiApiKey: readLocalApiKey(),
      adminFilterActiveOnly: false,
      showAddUserModal: false,
      showApiKeyModal: false
    };

    let firestoreApi = null;

    /**
     * Races a promise against a timeout so optional network operations never hang UI.
     */
    function withTimeout(promise, ms = 3500) {
      return Promise.race([
        promise,
        new Promise((_, reject) =>
          setTimeout(() => reject(new Error('Firestore operation timed out')), ms)
        )
      ]);
    }
  
    /**
     * Initializes Firebase Firestore in the background without blocking initial UI render.
     */
    async function initFirestoreBackground() {
      try {
        const [appMod, fsMod] = await withTimeout(
          Promise.all([
            import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),
            import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js')
          ]),
          4500
        );
        const app = appMod.initializeApp(firebaseConfig);
        const db = fsMod.getFirestore(app);
        firestoreApi = { db, ...fsMod };
        await hydrateFromFirestore();
      } catch (err) {
        console.warn('Firestore background sync unavailable:', err);
      }
    }

    /**
     * Hydrates users, API key, and saved fiches from Firestore into state + localStorage.
     */
    async function hydrateFromFirestore() {
      if (!firestoreApi) return;
      const { db, collection, doc, getDoc, getDocs, setDoc } = firestoreApi;

      try {
        const usersSnap = await withTimeout(getDocs(collection(db, 'users')), 3500);
        if (!usersSnap.empty) {
          const remoteUsers = [];
          usersSnap.forEach((docSnap) => {
            const data = docSnap.data() || {};
            remoteUsers.push({
              id: data.id || docSnap.id,
              name: data.name || '',
              password: data.password || '',
              passwordMask: data.passwordMask || '••••••••',
              frozen: Boolean(data.frozen),
              active: data.active !== undefined ? Boolean(data.active) : true
            });
          });
          if (remoteUsers.length > 0) {
            state.users = remoteUsers;
            writeLocalUsers(remoteUsers);
          }
        } else {
          for (const u of state.users) {
            await withTimeout(
              setDoc(doc(db, 'users', String(u.id)), u, { merge: true }),
              2500
            ).catch(() => {});
          }
        }
      } catch (err) {
        console.warn('Firestore users hydration warning:', err);
      }

      try {
        const keySnap = await withTimeout(getDoc(doc(db, 'settings', 'apiKey')), 3500);
        if (keySnap.exists()) {
          const val = (keySnap.data()?.key || keySnap.data()?.apiKey || '').trim();
          if (val) {
            state.geminiApiKey = val;
            writeLocalApiKey(val);
          }
        }
      } catch (err) {
        console.warn('Firestore apiKey hydration warning:', err);
      }

      try {
        const fichesSnap = await withTimeout(getDocs(collection(db, 'fiches_techniques')), 3500);
        if (!fichesSnap.empty) {
          const remoteFiches = [];
          fichesSnap.forEach((docSnap) => {
            const data = docSnap.data() || {};
            let parsedFiche = data.fiche;
            if (typeof parsedFiche === 'string') {
              try {
                parsedFiche = JSON.parse(parsedFiche);
              } catch {
                parsedFiche = null;
              }
            }
            if (parsedFiche) {
              remoteFiches.push({
                id: data.id || docSnap.id,
                title: data.title || parsedFiche.ppt_title || parsedFiche.titre_de_tache || docSnap.id,
                section: data.section || 'premier pages',
                fiche: parsedFiche,
                updatedAt: data.updatedAt || new Date().toISOString()
              });
            }
          });
          if (remoteFiches.length > 0) {
            state.savedFiches = remoteFiches;

    /**
     * Escapes HTML special characters safely.
     */
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /**
     * Wraps phrases enclosed within «» in a bold underlined span.
     */
    function formatGuillemetsBoldUnderline(rawText) {
      const text = String(rawText ?? '');
      const parts = text.split(/(«[^»]*»)/g);
      return parts
        .map((part) => {
          if (/^«[^»]*»$/.test(part)) {
            return `<span class="fiche-guillemet-bold-ul">${escapeHtml(part)}</span>`;
          }
          return escapeHtml(part);
        })
        .join('');
    }

    /**
     * Ensures every line/item in préparatoire and guidée starts with "- ".
     */
    function ensureLeadingDash(rawText) {
      const text = String(rawText ?? '').trim();
      if (!text) return '';
      if (/^-\s+/.test(text)) return text;
      return `- ${text.replace(/^[•*–—]+\s*/, '').trim()}`;
    }

    /**
     * Smooths guided practice phrasing and links task + lesson property/rule/definition
     * or falls back smoothly to "en utilisant <Titre de la leçon>" when absent.
     */
    function smoothGuideePhrase(rawText, basisText = '', lessonTitle = '') {
      let cleaned = stripActivityAndRituelleWords(rawText || '')
        .replace(/\b(?:en utilisant|avec)\s+(?:la propriété de|les règles de)\s+(?:en utilisant|avec)\b/gi, 'en utilisant')
        .replace(/\b(de|du|des)\s+(de|du|des)\b/gi, '$1')
        .replace(/\b(en|à|au|aux)\s+(en|à|au|aux)\b/gi, '$1')
        .replace(/\s*,\s*,/g, ',')
        .replace(/\s{2,}/g, ' ')
        .trim();

      const fallbackBasis = String(basisText || '').trim();
      const titleFallback = String(lessonTitle || '').replace(/^«|»$/g, '').trim();

      if (/priorit[ée]/i.test(cleaned) && /expression|calcul/i.test(cleaned)) {
        cleaned = 'Calculer une expression en respectant la priorité des opérations.';
      } else if (
        /radicaux\s+semblables|non-additivit[ée]|radicaux/i.test(cleaned) ||
        /radical|radicaux|racine/i.test(fallbackBasis)
      ) {
        return RADICAL_GUIDEE_PHRASE;
      } else if (!cleaned) {
        if (fallbackBasis) {
          cleaned = `Appliquer ${fallbackBasis} dans la résolution guidée.`;
        } else if (titleFallback) {
          cleaned = `Résoudre la tâche guidée en utilisant ${titleFallback}.`;
        } else {
          cleaned = 'Appliquer la propriété de la leçon pour résoudre la tâche guidée.';
        }
      } else {
        const withoutEndingPunct = cleaned.replace(/[.!?]+$/g, '').trim();
        const hasPropertyOrMethod =
          /en utilisant|propri[ée]t[ée]|r[èe]gle|d[ée]finition|respectant/i.test(
            withoutEndingPunct
          );
        if (!hasPropertyOrMethod) {
          if (fallbackBasis) {
            cleaned = `${withoutEndingPunct} selon ${fallbackBasis}.`;
          } else if (titleFallback) {
            cleaned = `${withoutEndingPunct} en utilisant ${titleFallback}.`;
          } else {
            cleaned = `${withoutEndingPunct}.`;
          }
        } else {
          cleaned = `${withoutEndingPunct}.`;
        }
      }

      cleaned = cleaned.charAt(0).toUpperCase() + cleaned.slice(1);
      return ensureLeadingDash(cleaned);
    }

    /**
     * Helper that underlines extracted items while keeping «» bold-underlined.
     */
    function renderExtractedItemsWithGuillemets(segmentText) {
      const cleanedSegment = String(segmentText ?? '').trim();
      if (!cleanedSegment) return '';
      return `<span class="fiche-extracted-ul">${formatGuillemetsBoldUnderline(cleanedSegment)}</span>`;
    }

    /**
     * Underlines strictly the extracted items in binôme.
     */
    function formatBinomeExtractedUnderline(rawBinomeText) {
      const text = String(rawBinomeText ?? '').trim();
      if (!text) return '';

      const match = text.match(/^(.*?)\s*:\s*en utilisant\s+(.+?)([.!?]*)$/i);
      if (match) {
        const extractedPrompt = match[1].trim();
        const extractedMethod = match[2].trim();
        const trailingPunct = match[3] || '';
        return `${renderExtractedItemsWithGuillemets(extractedPrompt)} : en utilisant ${renderExtractedItemsWithGuillemets(extractedMethod)}${escapeHtml(trailingPunct)}`;
      }

      return renderExtractedItemsWithGuillemets(text);
    }

    /**
     * Underlines strictly the extracted items in autonome.
     */
    function formatAutonomeExtractedUnderline(rawAutonomeText) {
      const text = String(rawAutonomeText ?? '').trim();
      if (!text) return '';

      const match = text.match(/^(.*?)\s*(:.*)$/);
      if (match) {
        const extractedPrompt = match[1].trim();
        const suffix = match[2];
        return `${renderExtractedItemsWithGuillemets(extractedPrompt)}${escapeHtml(suffix)}`;
      }

      return renderExtractedItemsWithGuillemets(text);
    }

    /**
     * Formats byte size into French units.
     */
    function formatFileSize(bytes) {
      if (!bytes && bytes !== 0) return '';
      if (bytes < 1024) return `${bytes} o`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} Ko`;
      return `${(bytes / (1024 * 1024)).toFixed(2)} Mo`;
    }

    /**
     * Reads a File object as a Data URL for image thumbnail preview and Gemini vision calls.
     */
    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(new Error('Impossible de lire le fichier image.'));
        reader.readAsDataURL(file);
      });
    }

    /**
     * Strips Arabic characters so extracted worksheet fields remain strictly in French.
     */
    function stripArabic(rawText) {
      return String(rawText ?? '')
        .replace(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/g, ' ')
        .replace(/\s{2,}/g, ' ')
        .trim();
    }

    /**
     * Strips stray slide/activity labels ("activité", "retulle", "rituelle").
     */
    function stripActivityAndRituelleWords(rawText) {
      return stripArabic(rawText)
        .replace(/\b(?:retulle|rituelle|rituelles)\b/gi, ' ')
        .replace(/\bactivit[ée]s?\b/gi, ' ')
        .replace(/^\s*[:\-–—.,;]+\s*/g, '')
        .replace(/\s{2,}/g, ' ')
        .trim();
    }

    /**
     * Cleans topic titles for definitions/properties.
     */
    function cleanTopicTitle(rawLine) {
      let line = stripArabic(rawLine)
        .replace(/^[-•*▪◦\d.)]+\s*/, '')
        .replace(/^(définition|propriété|règle|remarque|théorème)\s*:?\s*/i, '')
        .trim();
      if (line.length > 75 && line.includes(' : ')) {
        line = line.split(' : ')[0].trim();
      }
      return line.replace(/[.]+$/, '').trim();
    }

    /**
     * Extracts exercise prompt without trailing numeric calculation expressions.
     */
    function extractQuestionPromptOnly(rawText, fallbackPrompt = 'Compléter les égalités suivantes') {
      const cleaned = stripActivityAndRituelleWords(rawText);
      if (!cleaned) return fallbackPrompt;
      const colonIdx = cleaned.indexOf(':');
      let promptPart = colonIdx >= 0 ? cleaned.slice(0, colonIdx) : cleaned;
      promptPart = promptPart
        .replace(/\s*(?:=|×|\+|−|-|\/|:)\s*[-+]?\d+[\s\S]*$/g, '')
        .replace(/[.?!:;]+$/g, '')
        .trim();
      if (!promptPart) return fallbackPrompt;
      return promptPart.charAt(0).toUpperCase() + promptPart.slice(1);
    }

    /**
     * Dynamically extracts Leçon, Période, Tâche, and binôme page number when present.
     */
    function extractCourseMetadataAndBinomePage(fileName, slides) {
      const safeSlides = Array.isArray(slides) ? slides : [];
      const joinedText = [fileName || '', ...safeSlides.map((s) => s.text || '')].join('\n');

      const leconMatch = joinedText.match(
        /\b(?:le[çc]on|chapitre|s[ée]quence|unit[ée])\s*(?:n[°o.]?|num[ée]ro)?\s*[:\-]?\s*0?(\d{1,2})\b/i
      );
      const fileLeconMatch = String(fileName || '').match(
        /(?:le[çc]on|chap|seance|s[ée]ance|cours|fiche)[\s._-]*0?(\d{1,2})\b/i
      );
      const numeroLecon = leconMatch?.[1]
        ? String(parseInt(leconMatch[1], 10))
        : fileLeconMatch?.[1]
          ? String(parseInt(fileLeconMatch[1], 10))
          : '...';

      const periodeMatch = joinedText.match(
        /\bp[ée]riode\s*(?:n[°o.]?|num[ée]ro)?\s*[:\-]?\s*0?(\d{1,2})\b/i
      );
      const periode = periodeMatch?.[1] ? String(parseInt(periodeMatch[1], 10)) : '...';

      const tacheMatch = joinedText.match(
        /\bt[âa]che\s*(?:n[°o.]?|num[ée]ro)?\s*[:\-]?\s*0?(\d{1,2})\b/i
      );
      const numeroTache = tacheMatch?.[1] ? String(parseInt(tacheMatch[1], 10)) : '...';

      let binomePage = null;
      const binomeIdx = safeSlides.findIndex((s) =>
        /activit[ée]\s*bin[ôo]me|je\s+m'entra[îi]ne\s+en\s+bin[ôo]me/i.test(s.text || '')
      );
      const searchTargets = [];
      if (binomeIdx >= 0) {
        searchTargets.push(safeSlides[binomeIdx].text || '');
        if (safeSlides[binomeIdx + 1]) searchTargets.push(safeSlides[binomeIdx + 1].text || '');
      }
      const autoIdx = safeSlides.findIndex((s) => /activit[ée]\s*autonome/i.test(s.text || ''));
      if (autoIdx >= 0) {
        searchTargets.push(safeSlides[autoIdx].text || '');
        if (safeSlides[autoIdx + 1]) searchTargets.push(safeSlides[autoIdx + 1].text || '');
      }
      searchTargets.push(joinedText);

      for (const candidate of searchTargets) {
        const pageMatch = String(candidate).match(/\b(?:page|pages|p\.?)\s*(\d{1,3})\b/i);
        if (pageMatch && pageMatch[1]) {
          binomePage = parseInt(pageMatch[1], 10);
          break;
        }
      }

      return {
        numero_lecon: numeroLecon,
        periode,
        numero_tache: numeroTache,
        binomePage
      };
    }

    /**
     * Parses a .pptx file via JSZip (ppt/slides/slideN.xml) into ordered slides.
     */
    async function parsePptxSlides(file) {
      if (typeof window.JSZip === 'undefined') {
        throw new Error('Bibliothèque JSZip non chargée.');
      }
      const arrayBuffer = await file.arrayBuffer();
      const zip = await window.JSZip.loadAsync(arrayBuffer);

      const slideEntries = Object.keys(zip.files)
        .filter((path) => /^ppt\/slides\/slide\d+\.xml$/i.test(path))
        .sort((a, b) => {
          const numA = parseInt(a.match(/slide(\d+)\.xml/i)?.[1] || '0', 10);
          const numB = parseInt(b.match(/slide(\d+)\.xml/i)?.[1] || '0', 10);
          return numA - numB;
        });

      const parser = new DOMParser();
      const slides = [];

      for (let i = 0; i < slideEntries.length; i++) {
        const xmlText = await zip.files[slideEntries[i]].async('string');
        const xmlDoc = parser.parseFromString(xmlText, 'application/xml');
        const textNodes = Array.from(xmlDoc.getElementsByTagNameNS('*', 't'));
        const slideText = textNodes
          .map((node) => node.textContent || '')
          .join(' ')
          .replace(/\s+/g, ' ')
          .trim();

        slides.push({
          slideNumber: i + 1,
          text: slideText
        });
      }

      return slides;
    }
    
    /**
     * Local fallback extractor for standard lesson slides when no API key is set or Gemini fails.
     */
    function buildFallbackFicheFromSlides(fileName, slides) {
      const safeSlides = Array.isArray(slides) ? slides : [];
      const joined = safeSlides.map((s) => `[Diapositive ${s.slideNumber}] ${s.text}`).join('\n');
      const pptBaseTitle = extractPptFilenameTitle(fileName, 'Séance de mathématiques');
      const cleanedTitle =
        stripArabic(fileName.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ')) ||
        'Séance de mathématiques';

      const meta = extractCourseMetadataAndBinomePage(fileName, safeSlides);
      const effectiveBinomePage = meta.binomePage !== null ? meta.binomePage : 36;

      const isRadicalTopic = /radical|radicaux|racine/i.test(joined);
      const isPriorityTopic = /priorit[ée]/i.test(joined);

      const topics = ['Notion principale de la leçon'];
      if (isRadicalTopic) {
        topics[0] = 'Radicaux semblables et somme / différence de radicaux';
      } else if (isPriorityTopic) {
        topics[0] = 'Règles de priorité des opérations';
      } else if (/produit|multiplication/i.test(joined)) {
        topics[0] = 'Produit de deux nombres relatifs';
      } else if (/somme|addition|soustraction/i.test(joined)) {
        topics[0] = 'Somme et différence de nombres relatifs';
      }

      const methodBasis = topics[0].toLowerCase();
      let guideePhrase = `Effectuer la tâche guidée en utilisant ${methodBasis}.`;
      if (isRadicalTopic) {
        guideePhrase = RADICAL_GUIDEE_PHRASE;
      } else if (isPriorityTopic) {
        guideePhrase = 'Calculer une expression en respectant la priorité des opérations.';
      }
      guideePhrase = smoothGuideePhrase(guideePhrase, topics[0], cleanedTitle);

      return {
        isConsolidation: false,
        ppt_title: pptBaseTitle,
        titre_de_tache: cleanedTitle,
        objectif: cleanedTitle,
        numero_lecon: meta.numero_lecon,
        periode: meta.periode,
        numero_tache: meta.numero_tache,
        activite_prerequis: ensureLeadingDash(
          `Effectuer des calculs préparatoires en lien avec ${methodBasis}.`
        ),
        definitions_et_proprietes: topics,
        activite_guidee: guideePhrase,
        activite_binome: `Compléter les égalités suivantes : en utilisant ${methodBasis}.`,
        activite_autonome: 'Compléter les égalités suivantes :',
        erreurs_eleves: [
          'Confondre le signe du résultat lors du calcul.',
          'Oublier de vérifier la règle avant de conclure.'
        ],
        exercices_maison: buildHomeworkLine(meta.binomePage),
        pageN: effectiveBinomePage,
        pageNMinus1: effectiveBinomePage - 1,
        pageNMinus2: effectiveBinomePage - 2
      };
    }

    /**
     * Normalizes Consolidation extracted fields and enforces required structure:
     * - Titre: "Consolidation <numéro> : <titre du cours>"
     * - Rappel: each weekly lesson/notion on a "-" line
     * - Consolidation: objective starting with "Consolider"
     * - Page: page number
     * - Exercice: each exercise on its own line formatted as "Exercice <numéro> : <ce qui est demandé dans l'exercice>"
     */
    function normalizeConsolidationResult(raw, fileName) {
      const fallback = buildFallbackConsolidationFiche(fileName);
      const pptBaseTitle = extractPptFilenameTitle(fileName, '');

      const rawTitle = stripArabic(raw?.titre_de_tache || raw?.Titre || '');
      const numMatch =
        rawTitle.match(/consolidation\s*(\d+)/i) ||
        String(fileName || '').match(/consolidation\s*(\d+)/i);
      const consolNum = numMatch?.[1]
        ? String(parseInt(numMatch[1], 10))
        : fallback.titre_de_tache.match(/consolidation\s*(\d+)/i)?.[1] || '1';

      let courseTitle = rawTitle
        .replace(/^(?:titre\s*[:\-]?\s*)?consolidation\s*\d*\s*[:\-–—]?\s*/i, '')
        .replace(/^«|»$/g, '')
        .trim();
      if (!courseTitle) {
        courseTitle = fallback.titre_de_tache.replace(/^Consolidation\s*\d+\s*:\s*/i, '').trim();
      }
      const titreFinal = `Consolidation ${consolNum} : ${courseTitle}`;

      const rawRappel = Array.isArray(raw?.rappel_items)
        ? raw.rappel_items
        : Array.isArray(raw?.Rappel)
          ? raw.Rappel
          : typeof (raw?.rappel_items || raw?.Rappel) === 'string'
            ? String(raw?.rappel_items || raw?.Rappel).split(/\r?\n|;/)
            : [];

      const rappelClean = rawRappel
        .map((item) => stripArabic(item).trim())
        .filter(Boolean)
        .map((item) => ensureLeadingDash(item));
      const rappelFinal = rappelClean.length > 0 ? rappelClean : fallback.rappel_items;

      let consolObj = stripArabic(
        raw?.consolidation_objectif || raw?.Consolidation || raw?.objectif || ''
      ).trim();
      if (!consolObj) {
        consolObj = `Consolider et renforcer les acquis des élèves concernant ${courseTitle.toLowerCase()}.`;
      } else if (!/^consolider\b/i.test(consolObj)) {
        consolObj = `Consolider ${consolObj.charAt(0).toLowerCase()}${consolObj.slice(1)}`;
      }
      if (!/[.!?]$/.test(consolObj)) consolObj += '.';

      const rawPage = String(raw?.page_consolidation ?? raw?.Page ?? '').trim();
      const pageMatch = rawPage.match(/\d+/);
      const pageFinal = pageMatch ? pageMatch[0] : rawPage || fallback.page_consolidation;

      const rawExList = Array.isArray(raw?.exercices_consolidation)
        ? raw.exercices_consolidation
        : Array.isArray(raw?.Exercice)
          ? raw.Exercice
          : typeof (raw?.exercices_consolidation || raw?.Exercice) === 'string'
            ? String(raw?.exercices_consolidation || raw?.Exercice).split(/\r?\n/)
            : [];

      const exercicesFinal = rawExList
        .map((line) => stripArabic(line).replace(/^[-•*▪◦]+\s*/, '').trim())
        .filter(Boolean)
        .map((line, idx) => {
          const exMatch = line.match(/^exercice\s*([0-9]+(?:\.[0-9]+)*)\s*[:\-–—]?\s*(.*)$/i);
          if (exMatch) {
            const exNum = exMatch[1].trim();
            const exDemand = (exMatch[2] || '').trim() || 'Résoudre la tâche demandée.';
            return `Exercice ${exNum} : ${exDemand}`;
          }
          return `Exercice ${idx + 1} : ${line}`;
        });

      const rawLecon = String(raw?.numero_lecon ?? '').replace(/[^\d]/g, '').trim();
      const rawPeriode = String(raw?.periode ?? '').replace(/[^\d]/g, '').trim();
      const rawTache = String(raw?.numero_tache ?? '').replace(/[^\d]/g, '').trim();

      return {
        isConsolidation: true,
        ppt_title: pptBaseTitle || titreFinal,
        titre_de_tache: titreFinal,
        objectif: consolObj,
        consolidation_objectif: consolObj,
        numero_lecon: rawLecon ? String(parseInt(rawLecon, 10)) : fallback.numero_lecon,
        periode: rawPeriode ? String(parseInt(rawPeriode, 10)) : fallback.periode,
        numero_tache: rawTache ? String(parseInt(rawTache, 10)) : fallback.numero_tache,
        page_consolidation: pageFinal,
        rappel_items: rappelFinal,
        exercices_consolidation:
          exercicesFinal.length > 0 ? exercicesFinal : fallback.exercices_consolidation
      };
    }

    /**
     * Normalizes extracted standard lesson fields and enforces linguistic and formatting rules.
     */
    function normalizeFicheResult(raw, fileName, slides) {
      const fallback = buildFallbackFicheFromSlides(fileName, slides);
      const localMeta = extractCourseMetadataAndBinomePage(fileName, slides);
      const pptBaseTitle = extractPptFilenameTitle(fileName, fallback.titre_de_tache);

      const titreTache =
        stripActivityAndRituelleWords(raw?.titre_de_tache || '') || fallback.titre_de_tache;

      const rawLecon = String(raw?.numero_lecon ?? '').replace(/[^\d]/g, '').trim();
      const numeroLecon = rawLecon ? String(parseInt(rawLecon, 10)) : localMeta.numero_lecon;

      const rawPeriode = String(raw?.periode ?? '').replace(/[^\d]/g, '').trim();
      const periodeVal = rawPeriode ? String(parseInt(rawPeriode, 10)) : localMeta.periode;

      const rawTache = String(raw?.numero_tache ?? '').replace(/[^\d]/g, '').trim();
      const numeroTache = rawTache ? String(parseInt(rawTache, 10)) : localMeta.numero_tache;

      let prerequis = stripActivityAndRituelleWords(raw?.activite_prerequis || '');
      if (!prerequis) {
        prerequis = fallback.activite_prerequis;
      } else {
        if (
          !/^(effectuer|calculer|appliquer|déterminer|identifier|résoudre|comparer|classer|utiliser)\b/i.test(
            prerequis
          )
        ) {
          prerequis = `Effectuer ${prerequis.charAt(0).toLowerCase()}${prerequis.slice(1)}`;
        }
        if (!/[.!?]$/.test(prerequis)) prerequis += '.';
        prerequis = ensureLeadingDash(prerequis);
      }

      const defsArray = Array.isArray(raw?.definitions_et_proprietes)
        ? raw.definitions_et_proprietes.map((d) => cleanTopicTitle(d)).filter(Boolean)
        : typeof raw?.definitions_et_proprietes === 'string'
          ? raw.definitions_et_proprietes
              .split(/\r?\n|;/)
              .map((d) => cleanTopicTitle(d))
              .filter(Boolean)
          : [];

      const uniqueDefs = [];
      const seenDefs = new Set();
      for (const item of defsArray) {
        const k = item.toLowerCase();
        if (!seenDefs.has(k)) {
          seenDefs.add(k);
          uniqueDefs.push(item);
        }
      }

      const basisText =
        uniqueDefs.length > 0
          ? uniqueDefs.map((d) => d.toLowerCase()).join(' et ')
          : '';

      const rawGuidee = stripActivityAndRituelleWords(raw?.activite_guidee || '');
      const guidee = smoothGuideePhrase(rawGuidee, basisText, titreTache);

      const effectiveMethodText = basisText || titreTache.toLowerCase();
      const rawBinome = String(raw?.activite_binome || '');
      const binomeQuestionPrompt = extractQuestionPromptOnly(
        rawBinome,
        'Compléter les égalités suivantes'
      );
      const binomeMethodMatch = stripActivityAndRituelleWords(rawBinome).match(
        /(en utilisant[\s\S]*?)(?:[.!?]|$)/i
      );
      const binomeUsage = binomeMethodMatch
        ? binomeMethodMatch[1].trim().replace(/[.?!]+$/g, '')
        : `en utilisant ${effectiveMethodText}`;
      const binomeFinal = `${binomeQuestionPrompt} : ${binomeUsage}.`;

      const autonomeFinal = `${extractQuestionPromptOnly(
        raw?.activite_autonome || '',
        'Compléter les égalités suivantes'
      )} :`;

      let erreursList = Array.isArray(raw?.erreurs_eleves)
        ? raw.erreurs_eleves.map((e) => stripActivityAndRituelleWords(e)).filter(Boolean)
        : typeof raw?.erreurs_eleves === 'string'
          ? raw.erreurs_eleves
              .split(/\r?\n|;/)
              .map((e) => stripActivityAndRituelleWords(e))
              .filter(Boolean)
          : [];

      if (erreursList.length === 0) {
        erreursList = [...fallback.erreurs_eleves];
      } else if (erreursList.length === 1) {
        erreursList.push(fallback.erreurs_eleves[0]);
      } else {
        erreursList = erreursList.slice(0, 2);
      }

      const rawPageBinome = parseInt(raw?.page_binome, 10);
      const detectedBinomePage =
        Number.isFinite(rawPageBinome) && rawPageBinome > 0
          ? rawPageBinome
          : localMeta.binomePage;

      const pageN = detectedBinomePage !== null ? detectedBinomePage : 36;

      return {
  
    isConsolidation: false,
        ppt_title: pptBaseTitle,
        titre_de_tache: titreTache,
        objectif: titreTache,
        numero_lecon: numeroLecon,
        periode: periodeVal,
        numero_tache: numeroTache,
        activite_prerequis: prerequis,
        definitions_et_proprietes: uniqueDefs,
        activite_guidee: guidee,
        activite_binome: binomeFinal,
        activite_autonome: autonomeFinal,
        erreurs_eleves: erreursList,
        exercices_maison: buildHomeworkLine(detectedBinomePage),
        pageN,
        pageNMinus1: pageN - 1,
        pageNMinus2: pageN - 2
      };
    }

        sheetEl.outerHTML,

      );

    /**

     */
    function attachSavedFichesModalListeners() {
      const closeModalBtn = document.getElementById('btn-close-ready-fiches');
      if (closeModalBtn) {
        closeModalBtn.addEventListener('click', () => {
          state.showReadyFichesModal = false;
          window.renderApp();
        });
      }

      document.querySelectorAll('[data-open-fiche-id]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-open-fiche-id');
          const found = state.savedFiches.find((f) => String(f.id) === String(id));
          if (!found || !found.fiche) return;
          state.showReadyFichesModal = false;
          state.openedSavedFicheMode = true;
          state.selectedSection =
            found.section || (found.fiche.isConsolidation ? 'Consolidation' : 'premier pages');
          state.generatedFiche = JSON.parse(JSON.stringify(found.fiche));
          state.originalFicheBackup = JSON.parse(JSON.stringify(found.fiche));
          state.analysisError = '';
          navigateTo('preview');
        });
      });

      document.querySelectorAll('[data-del-fiche-id]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-del-fiche-id');
          await deleteSavedFicheRecord(id);
          window.renderApp();
          showToast('Fiche supprimée.', 'info');
        });
      });
    }

    /**
     * Attaches login and registration listeners including Hajar / 1947 admin shortcut and frozen check.
     */
    function attachLoginListeners() {
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const form = document.getElementById('auth-form');
      const nameInput = document.getElementById('input-name');
      const passInput = document.getElementById('input-password');
      const errorBox = document.getElementById('auth-error');

      if (tabLogin) {
        tabLogin.addEventListener('click', () => {
          state.authMode = 'login';
          window.renderApp();
        });
      }

      if (tabRegister) {
        tabRegister.addEventListener('click', () => {
          state.authMode = 'register';
          window.renderApp();
        });
      }

      if (!form) return;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          const rawName = (nameInput?.value || '').trim();
          const rawPass = (passInput?.value || '').trim();

          if (!rawName || !rawPass) {
            errorBox.textContent = 'يرجى إدخال الاسم وكلمة المرور — Veuillez saisir le nom et le mot de passe.';
            errorBox.classList.remove('hidden');
            return;
          }

          errorBox.classList.add('hidden');

          if (state.authMode === 'login' && rawName.toLowerCase() === 'hajar' && rawPass === '1947') {
            state.currentUser = rawName;
            state.isAdmin = true;
            state.openedSavedFicheMode = false;
            showToast('Bienvenue Hajar — Accès Pages Admin', 'success');
            navigateTo('admin');
            return;
          }

          const existingUser = state.users.find(
            (u) => (u.name || '').toLowerCase() === rawName.toLowerCase()
          );

          if (state.authMode === 'register') {
            if (existingUser) {
              errorBox.textContent = `الاسم "${rawName}" مستعمل مسبقاً — Ce nom d'utilisateur existe déjà.`;
              errorBox.classList.remove('hidden');
              return;
            }

            const newUser = {
              id: String(Date.now()),
              name: rawName,
              password: rawPass,
              passwordMask: '•'.repeat(Math.max(8, Math.min(13, rawPass.length + 4))),
              frozen: false,
              active: true
            };

            await saveUserToStore(newUser);
            state.currentUser = rawName;
            state.isAdmin = false;
            state.openedSavedFicheMode = false;
            showToast(`تم إنشاء الحساب بنجاح — Bienvenue ${rawName}`, 'success');
            navigateTo('accueil');
            return;
          }

          if (!existingUser) {
            errorBox.textContent = 'الحساب غير موجود — Compte introuvable. Veuillez créer un compte.';
            errorBox.classList.remove('hidden');
            return;
          }

          if (existingUser.frozen) {
            errorBox.textContent = 'هذا الحساب مجمد — Ce compte est gelé par l’administrateur.';
            errorBox.classList.remove('hidden');
            return;
          }

          if (existingUser.password && existingUser.password !== rawPass) {
            errorBox.textContent = 'كلمة المرور غير صحيحة — Mot de passe incorrect.';
            errorBox.classList.remove('hidden');
            return;
          }

          state.currentUser = existingUser.name;
          state.isAdmin = false;
          state.openedSavedFicheMode = false;
          showToast(`مرحباً ${existingUser.name} — Connexion réussie`, 'success');
          navigateTo('accueil');
        } catch (err) {
          console.error('Authentication error:', err);
          showDiagnosticError(err.message || 'Erreur lors de la connexion.');
          errorBox.textContent = 'حدث خطأ أثناء العملية — Une erreur est survenue.';
          errorBox.classList.remove('hidden');
        }
      });
    }

    /**
     * Attaches upload and analysis listeners on 'upload' screen.
     */
    function attachUploadListeners() {
      const backBtn = document.getElementById('btn-back-accueil');
      const dropzone = document.getElementById('upload-dropzone');
      const fileInput = document.getElementById('file-upload-input');
      const createBtn = document.getElementById('btn-create-fiche');
      const clearFileBtn = document.getElementById('btn-clear-file');
      const isConsolidation = state.selectedSection === 'Consolidation';

      if (backBtn) {
        backBtn.addEventListener('click', () => {
          navigateTo('accueil');
        });
      }

      const handleFiles = async (files) => {
        if (!files || !files.length) return;
        const picked = files[0];

        if (
          isConsolidation &&
          !String(picked.type || '').startsWith('image/') &&
          !/\.(png|jpe?g|webp|gif|bmp)$/i.test(picked.name)
        ) {
          showToast('Veuillez sélectionner une image valide pour Consolidation.', 'warning');
          return;
        }

        state.openedSavedFicheMode = false;
        state.uploadedFile = {
          name: picked.name,
          size: picked.size,
          type: picked.type || 'application/octet-stream',
          rawFile: picked,
          imageDataUrl: ''
        };
        state.parsedSlides = [];
        state.generatedFiche = null;
        state.originalFicheBackup = null;
        state.analysisError = '';

        if (isConsolidation) {
          try {
            state.uploadedFile.imageDataUrl = await readFileAsDataURL(picked);
            showToast(`Image chargée : ${picked.name}`, 'info');
          } catch (err) {
            console.warn('Image read warning:', err);
            showToast(`Image sélectionnée : ${picked.name}`, 'info');
          }
        } else if (/\.pptx$/i.test(picked.name)) {
          try {
            const slides = await parsePptxSlides(picked);
            state.parsedSlides = slides;
            showToast(`Fichier PPTX chargé (${slides.length} diapositives)`, 'info');
          } catch (err) {
            console.warn('PPTX pre-parse warning:', err);
            showToast(`Fichier sélectionné : ${picked.name}`, 'info');
          }
        } else {
          showToast(`Fichier sélectionné : ${picked.name}`, 'info');
        }

        window.renderApp();
      };
      fileInput.addEventListener('change', (e) => {
          handleFiles(e.target.files);
        });

        ['dragenter', 'dragover'].forEach((evtName) => {
          dropzone.addEventListener(evtName, (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropzone.classList.add('drag-over');
          });
        });

        ['dragleave', 'drop'].forEach((evtName) => {
          dropzone.addEventListener(evtName, (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropzone.classList.remove('drag-over');
          });
        });

        dropzone.addEventListener('drop', (e) => {
          const dt = e.dataTransfer;
          if (dt && dt.files) {
            handleFiles(dt.files);
          }
        });
      }

      if (clearFileBtn && fileInput) {
        clearFileBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          state.uploadedFile = null;
          state.parsedSlides = [];
          state.generatedFiche = null;
          state.originalFicheBackup = null;
          state.analysisError = '';
          fileInput.value = '';
          window.renderApp();
        });
      }

      if (createBtn) {
        createBtn.addEventListener('click', async () => {
          if (!state.uploadedFile || !state.uploadedFile.rawFile) {
            showToast(
              isConsolidation
                ? 'Veuillez sélectionner une image via UPLOAD.'
                : 'Veuillez sélectionner un fichier via UPLOAD.',
              'warning'
            );
            if (fileInput) fileInput.click();
            return;
          }

          state.isAnalyzing = true;
          state.analysisError = '';
          window.renderApp();

          try {
            const activeApiKey = (state.geminiApiKey || readLocalApiKey() || '').trim();

            if (isConsolidation) {
              const dataUrl =
                state.uploadedFile.imageDataUrl ||
                (await readFileAsDataURL(state.uploadedFile.rawFile));
              state.uploadedFile.imageDataUrl = dataUrl;

              if (activeApiKey) {
                state.generatedFiche = await analyzeConsolidationImageWithGemini(
                  activeApiKey,
                  state.uploadedFile.name,
                  dataUrl
                );
                showToast('Fiche de consolidation générée avec Gemini.', 'success');
              } else {
                state.generatedFiche = buildFallbackConsolidationFiche(state.uploadedFile.name);
                showToast('Fiche de consolidation générée (modèle local).', 'info');
              }

              state.originalFicheBackup = JSON.parse(JSON.stringify(state.generatedFiche));
              state.isAnalyzing = false;
              navigateTo('preview');
              return;
            }

            let slides = state.parsedSlides;
            if (!slides || slides.length === 0) {
              if (/\.pptx$/i.test(state.uploadedFile.name)) {
                slides = await parsePptxSlides(state.uploadedFile.rawFile);
              } else {
                const textContent = await state.uploadedFile.rawFile.text().catch(() => '');
                slides = [{ slideNumber: 1, text: textContent.slice(0, 8000) }];
              }
              state.parsedSlides = slides;
            }

            if (activeApiKey) {
              state.generatedFiche = await analyzeSlidesWithGemini(
                activeApiKey,
                state.uploadedFile.name,
                slides
              );
              showToast('Fiche pédagogique générée avec Gemini.', 'success');
            } else {
              state.generatedFiche = buildFallbackFicheFromSlides(
                state.uploadedFile.name,
                slides
              );
              showToast('Fiche générée (analyse locale).', 'info');
            }

            state.originalFicheBackup = JSON.parse(JSON.stringify(state.generatedFiche));
            state.isAnalyzing = false;
            navigateTo('preview');
          } catch (err) {
            console.error('Fiche generation error:', err);
            state.analysisError = `Erreur d'analyse : ${err.message || 'Impossible de traiter le fichier.'}`;
            if (isConsolidation) {
              state.generatedFiche = buildFallbackConsolidationFiche(state.uploadedFile.name);
            } else {
              state.generatedFiche = buildFallbackFicheFromSlides(
                state.uploadedFile.name,
                state.parsedSlides || []
              );
            }
            state.originalFicheBackup = JSON.parse(JSON.stringify(state.generatedFiche));
            showToast('Extraction locale appliquée.', 'warning');
            state.isAnalyzing = false;
            navigateTo('preview');
          }
        });
      }
    }

    /**
     * Attaches handlers for the 'preview' screen.
     */
    function attachPreviewListeners() {
      const backToUploadBtn = document.getElementById('btn-back-to-upload');
      const returnToSavedBtn = document.getElementById('btn-return-to-saved-fiches');
      const downloadPdfBtn = document.getElementById('btn-download-saved-pdf');
      const printBtn = document.getElementById('btn-print-fiche');
      const toggleEditBtn = document.getElementById('btn-toggle-edit-fiche');
      const resetEditBtn = document.getElementById('btn-reset-edit-fiche');
      const saveEditBtn = document.getElementById('btn-save-edit-fiche');

      const goBackToSavedFiches = () => {
        state.openedSavedFicheMode = false;
        state.showReadyFichesModal = true;
        navigateTo('accueil');
      };

      const syncEditedFicheFromDom = () => {
        if (!state.generatedFiche) return;
        const leconEl = document.getElementById('fiche-field-lecon');
        const periodeEl = document.getElementById('fiche-field-periode');
        const tacheEl = document.getElementById('fiche-field-tache');
        const titreEl = document.getElementById('fiche-field-titre');
        const objectifEl = document.getElementById('fiche-field-objectif');

        if (leconEl) state.generatedFiche.numero_lecon = leconEl.innerText.trim();
        if (periodeEl) state.generatedFiche.periode = periodeEl.innerText.trim();
        if (tacheEl) state.generatedFiche.numero_tache = tacheEl.innerText.trim();
        if (titreEl) state.generatedFiche.titre_de_tache = titreEl.innerText.trim();
        if (objectifEl) state.generatedFiche.objectif = objectifEl.innerText.trim();

        if (state.generatedFiche.isConsolidation) {
          if (objectifEl) state.generatedFiche.consolidation_objectif = objectifEl.innerText.trim();
          const consolPageEl = document.getElementById('fiche-field-consol-page');
          const consolRappelEl = document.getElementById('fiche-field-consol-rappel');
          const consolExEl = document.getElementById('fiche-field-consol-exercices');

          if (consolPageEl) state.generatedFiche.page_consolidation = consolPageEl.innerText.trim();
          if (consolRappelEl) {
            const lines = consolRappelEl.innerText
              .split(/\r?\n/)
              .map((l) => l.trim())
              .filter(Boolean);
            if (lines.length > 0) state.generatedFiche.rappel_items = lines;
          }
          if (consolExEl) {
            const lines = consolExEl.innerText
              .split(/\r?\n/)
              .map((l) => l.trim())
              .filter(Boolean);
            if (lines.length > 0) state.generatedFiche.exercices_consolidation = lines;
          }
          return;
        }

        const prereqEl = document.getElementById('fiche-field-prerequis');
        const guideeEl = document.getElementById('fiche-field-guidee');
        const binomeEl = document.getElementById('fiche-field-binome');
        const autonomeEl = document.getElementById('fiche-field-autonome');
        const erreursEl = document.getElementById('fiche-field-erreurs');
        const exercicesEl = document.getElementById('fiche-field-exercices');
        const defsEl = document.getElementById('fiche-field-defs');

        if (prereqEl) state.generatedFiche.activite_prerequis = prereqEl.innerText.trim();
        if (guideeEl) state.generatedFiche.activite_guidee = guideeEl.innerText.trim();
        if (binomeEl) state.generatedFiche.activite_binome = binomeEl.innerText.trim();
        if (autonomeEl) state.generatedFiche.activite_autonome = autonomeEl.innerText.trim();
        if (exercicesEl) state.generatedFiche.exercices_maison = exercicesEl.innerText.trim();
        if (erreursEl) {
          const lines = erreursEl.innerText
            .split(/\r?\n/)
            .map((l) => l.replace(/^[-•\s]+/, '').trim())
            .filter(Boolean);
          if (lines.length > 0) state.generatedFiche.erreurs_eleves = lines;
        }
        if (defsEl) {
          const topics = defsEl.innerText
            .split(/\r?\n/)
            .map((l) => l.replace(/^[•\-\s]+/, '').trim())
            .filter(Boolean);
          if (topics.length > 0) state.generatedFiche.definitions_et_proprietes = topics;
        }
      };

      if (backToUploadBtn) {
        backToUploadBtn.addEventListener('click', () => {
          if (state.openedSavedFicheMode) {
            goBackToSavedFiches();
            return;
          }
          syncEditedFicheFromDom();
          navigateTo('upload');
        });
      }

      if (returnToSavedBtn) {
        returnToSavedBtn.addEventListener('click', goBackToSavedFiches);
      }

      if (downloadPdfBtn) {
        downloadPdfBtn.addEventListener('click', () => {
          window.print();
        });
      }

      if (printBtn) {
        printBtn.addEventListener('click', () => {
          syncEditedFicheFromDom();
          window.print();
        });
      }

      if (toggleEditBtn) {
        toggleEditBtn.addEventListener('click', () => {
          syncEditedFicheFromDom();
          state.ficheEditEnabled = !state.ficheEditEnabled;
          window.renderApp();
          showToast(
            state.ficheEditEnabled
              ? 'Édition active : modifiez directement les cellules.'
              : 'Mode lecture seule activé.',
            'info'
          );
        });
      }

      if (resetEditBtn) {
        resetEditBtn.addEventListener('click', () => {
          if (state.originalFicheBackup) {
            state.generatedFiche = JSON.parse(JSON.stringify(state.originalFicheBackup));
            window.renderApp();
            showToast('Modifications réinitialisées.', 'info');
          }
        });
      }

      if (saveEditBtn) {
        saveEditBtn.addEventListener('click', async () => {
          syncEditedFicheFromDom();
          const sectionName = state.selectedSection || 'premier pages';
          const identityTitle = getFicheIdentityTitle(state.generatedFiche, sectionName);
          const titleKey = normalizeFicheTitleKey(identityTitle);

          const alreadyExists = state.savedFiches.some(
            (item) => normalizeFicheTitleKey(item.title) === titleKey
          );

          if (alreadyExists) {
            showToast('deja exist', 'warning');
            return;
          }

          const record = {
            id: `fiche_${Date.now()}`,
            title: identityTitle,
            section: sectionName,
            fiche: JSON.parse(JSON.stringify(state.generatedFiche)),
            updatedAt: new Date().toISOString()
          };

          await persistSavedFicheRecord(record);
          const sheetEl = document.getElementById('fiche-editable-sheet');
          if (sheetEl) {
            downloadFicheElementAsHtm(sheetEl, state.generatedFiche, sectionName);
          }
        });
      }
    }

          state.showReadyFichesModal = false;
          state.showAddUserModal = false;
          state.showApiKeyModal = false;
          state.adminFilterActiveOnly = false;
          navigateTo('login');
        });
      }

      if (fichesBtn) {
        fichesBtn.addEventListener('click', () => {
          state.showReadyFichesModal = true;
          window.renderApp();
          void hydrateFromFirestore();
        });
      }

      attachSavedFichesModalListeners();

      if (networkBtn) {
        networkBtn.addEventListener('click', () => {
          state.adminFilterActiveOnly = !state.adminFilterActiveOnly;
          window.renderApp();
          showToast(
            state.adminFilterActiveOnly
              ? 'Affichage des utilisateurs actifs (non gelés)'
              : 'Affichage de tous les utilisateurs',
            'info'
          );
        });
      }

      if (starBtn) {
        starBtn.addEventListener('click', () => {
          state.showAddUserModal = false;
          state.showApiKeyModal = false;
          navigateTo('accueil');
        });
      }

      if (keyBtn) {
        keyBtn.addEventListener('click', () => {
          state.showApiKeyModal = !state.showApiKeyModal;
          if (state.showApiKeyModal) state.showAddUserModal = false;
          window.renderApp();
        });
      }

      if (toggleAddBtn) {
        toggleAddBtn.addEventListener('click', () => {
          state.showAddUserModal = !state.showAddUserModal;
          if (state.showAddUserModal) state.showApiKeyModal = false;
          window.renderApp();
        });
      }

      const apiKeyForm = document.getElementById('api-key-form');
      const closeApiKeyBtn = document.getElementById('close-api-key');

      if (closeApiKeyBtn) {
        closeApiKeyBtn.addEventListener('click', () => {
          state.showApiKeyModal = false;
          window.renderApp();
        });
      }

      if (apiKeyForm) {
        apiKeyForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const inputEl = document.getElementById('api-key-input');
          const keyVal = (inputEl?.value || '').trim();
          if (!keyVal) {
            showToast('Veuillez saisir une clé API valide.', 'warning');
            return;
          }
          await saveApiKeyToStore(keyVal);
          state.showApiKeyModal = false;
          window.renderApp();
          showToast('API key enregistrée.', 'success');
        });
      }

      const addForm = document.getElementById('add-user-form');
      const closeAddBtn = document.getElementById('close-add-user');

      if (closeAddBtn) {
        closeAddBtn.addEventListener('click', () => {
          state.showAddUserModal = false;
          window.renderApp();
        });
      }

      if (addForm) {
        addForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const nameEl = document.getElementById('new-user-name');
          const passEl = document.getElementById('new-user-pass');
          const nameVal = (nameEl?.value || '').trim();
          const passVal = (passEl?.value || '').trim();

          if (!nameVal || !passVal) {
            showToast('Veuillez saisir un nom et un mot de passe.', 'warning');
            return;
          }

          const exists = state.users.some(
            (u) => (u.name || '').toLowerCase() === nameVal.toLowerCase()
          );
          if (exists) {
            showToast(`L'utilisateur "${nameVal}" existe déjà.`, 'warning');
            return;
          }

          const newUser = {
            id: String(Date.now()),
            name: nameVal,
            password: passVal,
            passwordMask: '•'.repeat(Math.max(7, Math.min(13, passVal.length + 3))),
            frozen: false,
            active: true
          };

          await saveUserToStore(newUser);
          state.showAddUserModal = false;
          window.renderApp();
          showToast(`Utilisateur "${nameVal}" ajouté.`, 'success');
        });
      }

      if (rowsContainer) {
        rowsContainer.addEventListener('click', async (e) => {
          const btn = e.target.closest('button[data-action]');
          if (!btn) return;

          const action = btn.getAttribute('data-action');
          const id = btn.getAttribute('data-id');
          const targetUser = state.users.find((u) => String(u.id) === String(id));
          if (!targetUser) return;

          if (action === 'delete') {
            await deleteUserFromStore(id);
            window.renderApp();
            showToast(`"${targetUser.name}" supprimé.`, 'error');
          } else if (action === 'freeze') {
            const nextFrozen = !targetUser.frozen;
            await updateUserInStore(id, { frozen: nextFrozen, active: !nextFrozen });
            window.renderApp();
            showToast(
              nextFrozen
                ? `Compte de "${targetUser.name}" gelé.`
                : `Compte de "${targetUser.name}" réactivé.`,
              'warning'
            );
          }
        });
      }
    }

    /**
     * Global window.renderApp orchestrator managing all 5 screens ('login', 'accueil', 'upload', 'preview', 'admin').
     */
    function renderApp() {
      try {
        const container = screenContainer || document.getElementById('screen-container');
        if (!container) return;

        let html = '';
        if (state.screen === 'login') {
          html = renderLoginScreen();
        } else if (state.screen === 'accueil') {
          html = renderAccueilScreen();
        } else if (state.screen === 'upload') {
          html = renderUploadScreen();
        } else if (state.screen === 'preview') {
          html = renderPreviewScreen();
        } else if (state.screen === 'admin') {
          html = renderAdminScreen();
        } else {
          state.screen = 'login';
          html = renderLoginScreen();
        }

        container.innerHTML = html;

        if (state.screen === 'login') {
          attachLoginListeners();
        } else if (state.screen === 'accueil') {
          attachAccueilListeners();
        } else if (state.screen === 'upload') {
          attachUploadListeners();
        } else if (state.screen === 'preview') {
          attachPreviewListeners();
        } else if (state.screen === 'admin') {
          attachAdminListeners();
        } else {
          attachLoginListeners();
        }
      } catch (err) {
        console.error('Render fallback error:', err);
        showDiagnosticError(err.message || 'Erreur de rendu.');
        const container = screenContainer || document.getElementById('screen-container');
        if (container) {
          container.innerHTML = `
            <div class="flex-1 flex flex-col items-center justify-center text-center p-6 space-y-4">
              <div class="w-14 h-14 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center font-extrabold text-xl">!</div>
              <p class="text-sm font-bold text-[#111625]">Récupération de l'interface...</p>
              <button
                type="button"
                id="btn-fallback-recover"
                class="px-4 py-2.5 rounded-xl bg-[#1857b8] text-white text-sm font-bold cursor-pointer"
              >
                Recharger Connexion
              </button>
            </div>
          `;
          const recoverBtn = document.getElementById('btn-fallback-recover');
          if (recoverBtn) {
            recoverBtn.addEventListener('click', () => {
              state.screen = 'login';
              window.renderApp();
            });
          }
        }
      }
    }

    window.renderApp = renderApp;

    // Immediate render on script evaluation so #screen-container is never blank
    window.renderApp();

    window.addEventListener('DOMContentLoaded', () => {
      try {
        window.renderApp();
        void initFirestoreBackground();
      } catch (domErr) {
        console.warn('DOMContentLoaded warning:', domErr);
        showDiagnosticError(domErr.message || 'Erreur au chargement.');
      }
    });
  </script>
</body>
</html>
